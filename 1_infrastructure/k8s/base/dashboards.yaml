# ─── public · anonymous · port 8088 ─────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: public-dashboard, namespace: nhdw, labels: { app: public-dashboard, tier: dashboard } }
spec:
  replicas: 1
  selector: { matchLabels: { app: public-dashboard } }
  template:
    metadata: { labels: { app: public-dashboard, tier: dashboard } }
    spec:
      containers:
        - name: dashboard
          image: nhdw-registry:5500/nhdw/public-dashboard:dev
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 80, name: http } ]
          env:
            # Fayda Replica is EXTERNAL (0_external/fayda, compose on host port 8096
            # — like the source replicas). The pod reaches it via the k3d host route;
            # the citizen's browser opens the popup on localhost.
            - { name: FAYDA_INTERNAL_BASE, value: "http://host.k3d.internal:8096" }
            - { name: FAYDA_PUBLIC_BASE,   value: "http://localhost:8096" }
            # OAuth-state signer key — secret-driven (optional → absent falls back
            # to the app's in-code default, so this is non-breaking).
            - name: FAYDA_STATE_SECRET
              valueFrom: { secretKeyRef: { name: app-signing-secrets, key: FAYDA_STATE_SECRET, optional: true } }
          readinessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 3, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: public-dashboard, namespace: nhdw, labels: { app: public-dashboard } }
spec:
  selector: { app: public-dashboard }
  ports: [ { port: 80, targetPort: http, name: http } ]

