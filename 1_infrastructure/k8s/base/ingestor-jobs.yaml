# Source ingestor Jobs — real dlt ingestors that pull each EXTERNAL compose source
# replica into the MinIO data lake (nhdw-raw), replacing the retired seed-minio.
# Run in dependency order by seed-realistic.sh (AFTER minio-init, BEFORE ch-raw-views).
# They reach the host-published source ports via host.k3d.internal (k3d injects it into
# CoreDNS; bootstrap.sh verifies/patches it — see the host.k3d.internal preflight).
#
# Registry image names are remapped to nhdw/*:dev by seed-realistic.sh's sed. Source DB/API
# credentials come from the `source-creds` Secret (overlays/dev/secrets.yaml); MinIO creds
# from `minio-secrets`. These Jobs are NOT applied by kustomize — they are one-shot pipeline
# steps invoked via run_job(). Each Job is fully self-contained (no YAML anchors: anchors do
# not cross `---` document boundaries, and a list anchor cannot be spliced into an env list —
# repo rule 4 favours this repetition over shared coupling anyway).
---
apiVersion: batch/v1
kind: Job
metadata: { name: dhis2-ingest-metadata, namespace: nhdw, labels: { app: dhis2-ingestor, tier: pipeline } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata: { labels: { app: dhis2-ingestor, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ingestor
          image: nhdw-registry:5500/nhdw/dhis2-ingestor:1.0.0
          imagePullPolicy: Always
          args: ["metadata"]
          env:
            - { name: DHIS2_BASE_URL, value: "http://host.k3d.internal:8080" }
            - { name: DHIS2_USER,     valueFrom: { secretKeyRef: { name: source-creds, key: DHIS2_USER } } }
            - { name: DHIS2_PASSWORD, valueFrom: { secretKeyRef: { name: source-creds, key: DHIS2_PASSWORD } } }
            - { name: DHIS2_PAGE_SIZE, value: "200" }
            - { name: MINIO_ENDPOINT,   value: "http://minio-datalake.nhdw.svc.cluster.local:9000" }
            - { name: MINIO_ACCESS_KEY, valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER } } }
            - { name: MINIO_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
            - { name: MINIO_RAW_BUCKET, value: "nhdw-raw" }
            - { name: MINIO_REGION,     value: "et-addis-1" }
---
apiVersion: batch/v1
kind: Job
metadata: { name: dhis2-ingest-dvs, namespace: nhdw, labels: { app: dhis2-ingestor, tier: pipeline } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata: { labels: { app: dhis2-ingestor, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ingestor
          image: nhdw-registry:5500/nhdw/dhis2-ingestor:1.0.0
          imagePullPolicy: Always
          args: ["data-value-sets"]
          env:
            - { name: DHIS2_BASE_URL, value: "http://host.k3d.internal:8080" }
            - { name: DHIS2_USER,     valueFrom: { secretKeyRef: { name: source-creds, key: DHIS2_USER } } }
            - { name: DHIS2_PASSWORD, valueFrom: { secretKeyRef: { name: source-creds, key: DHIS2_PASSWORD } } }
            - { name: DHIS2_PAGE_SIZE, value: "200" }
            # Seeded values carry import-time lastUpdated; a low floor grabs all on run 1.
            # append + dlt incremental(last_updated): later runs pull only the delta
            # (dlt restores the watermark from lake state), so re-runs do NOT double-count.
            - { name: DHIS2_INITIAL_LAST_UPDATED, value: "2020-01-01" }
            - { name: MINIO_ENDPOINT,   value: "http://minio-datalake.nhdw.svc.cluster.local:9000" }
            - { name: MINIO_ACCESS_KEY, valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER } } }
            - { name: MINIO_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
            - { name: MINIO_RAW_BUCKET, value: "nhdw-raw" }
            - { name: MINIO_REGION,     value: "et-addis-1" }
---
