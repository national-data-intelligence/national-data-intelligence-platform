name: Deploy to k3s (push → redeploy)

# Continuous deployment on pushes to main and develop ONLY. Runs on a SELF-HOSTED
# runner that lives on the k3s host (so it has docker + kubectl + repo, no SSH-key
# dance). It rebuilds only the images whose source changed, imports them into k3s,
# restarts the affected workloads, reseeds catalog/RBAC when those seeds changed,
# and verifies. develop = the integration branch (feature work merges there and is
# deployed + tested on the cluster before it ever reaches main).
# The heavier from-bare install (provision k3s + full seed) is `provision.yml`.

on:
  push:
    branches: [main, develop]
    paths:
      # app tier
      - '6_access-points/**'
      - '5_orchestrator/**'                       # DAGs baked into nhdw/airflow
      - 'bundle/seed-pack/app/security/**'
      - '7_security/scripts/**'
      - '7_security/opa/**'                       # policy source → regen + reload
      - 'bundle/roles/**'                         # role YAMLs → reseed + policy regen
      - '2_pipelines/ml/registry/validators.py'   # baked into nhdw/gateway
      - 'bundle/scripts/ci-redeploy.sh'
      # k8s manifests — the overlay is applied (Secrets excluded, see ci-redeploy)
      - '1_infrastructure/k8s/**'
      # data tier (pipeline images, init DDL, reference vocabulary, MDM)
      - '2_pipelines/staging/**'
      - '2_pipelines/vault/**'
      - '2_pipelines/marts/**'
      - '2_pipelines/mdm/**'
      - '3_storage/postgres/init/**'
      - 'bundle/seeds/ref-vocab/**'
      # TEMPORARY — the demo console riding along to reach this runner.
      # Remove with _deploy-once/ and the deploy-console job below.
      - '_deploy-once/**'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Redeploy scope: "all" for everything, or blank for changed-only'
        required: false
        default: ''

concurrency:
  # ONE group for every workflow that mutates the cluster. Provisioning and a
  # redeploy both drive helm against the same release; running them at once
  # races two `helm upgrade`s and can leave the release wedged mid-transaction.
  # Queue instead of cancel — an interrupted deploy is worse than a slow one.
  #
  # Caveat worth knowing: GitHub keeps at most ONE pending run per group, so a
  # third arrival cancels the one already waiting. Pushing while a manual
  # scope=all dispatch is queued will cancel that dispatch — re-trigger it after
  # the in-flight run finishes rather than assuming it ran.
  group: nhdw-cluster
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: [self-hosted, nhdw]
    env:
      KUBECONFIG: ${{ secrets.NHDW_KUBECONFIG_PATH || '/home/biniyam/.kube/config' }}
      NS: nhdw
      # verify-system probes the live ingress — must match the deployed hostBase
      # (defaults to 127.0.0.1.nip.io otherwise and reports a false outage)
      NHDW_HOSTBASE: ${{ vars.NHDW_HOSTBASE || '20.84.70.78.nip.io' }}
      # the deployment's own secrets.yaml (gitignored); used ONLY to render the
      # overlay — Secrets themselves are never applied from CI
      NHDW_SECRETS_FILE: ${{ vars.NHDW_SECRETS_FILE || '/home/biniyam/ethio-nhdw-demo/1_infrastructure/k8s/overlays/dev/secrets.yaml' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute redeploy scope
        id: scope
        run: |
          if [ -n "${{ github.event.inputs.scope }}" ]; then
            echo "value=${{ github.event.inputs.scope }}" >> "$GITHUB_OUTPUT"
          else
            # whole push range, not just the last commit (HEAD~1 misses the
            # earlier commits of a multi-commit push); fall back on force-push
            # or first push where event.before is unknown/all-zeros
            changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" 2>/dev/null | tr '\n' ' ')" \
              || changed=""
            [ -z "$changed" ] && changed="$(git diff --name-only HEAD~1 HEAD | tr '\n' ' ')"
            echo "value=${changed:-all}" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy changed components
        run: bash bundle/scripts/ci-redeploy.sh "${{ steps.scope.outputs.value }}"

  # ── TEMPORARY ─────────────────────────────────────────────────────────────
  # The demo console is a SEPARATE project with its own repository, deliberately
  # outside this cluster: it reaches NHDW over the public demo contract and
  # shares nothing with it. It is here only because it has to reach this runner
  # and the runner only checks out this repository.
  #
  # Delete this job and _deploy-once/ once the console has its own workflow. It
  # runs after the cluster redeploy and never blocks it — a console that fails to
  # come up must not mark an NHDW deployment failed.
  deploy-console:
    needs: redeploy
    if: always() && !cancelled()
    runs-on: [self-hosted, nhdw]
    steps:
      - uses: actions/checkout@v4

      - name: Sync the console to /opt and bring it up
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/_deploy-once/palladium-console"
          DST=/opt/palladium-console
          sudo mkdir -p "$DST"
          # --delete so a file removed upstream goes here too, but NEVER the
          # .env: it holds the database password generated on first deploy and
          # regenerating it orphans the volume.
          sudo rsync -a --delete --exclude '.env' "$SRC"/ "$DST"/

          if [ ! -f "$DST/.env" ]; then
            PW="$(head -c 24 /dev/urandom | base64 | tr -d '/+=' | head -c 24)"
            sudo tee "$DST/.env" >/dev/null <<ENV
          CONSOLE_DB_PASSWORD=$PW
          CONSOLE_DOMAIN=${NHDW_HOSTBASE}
          CONSOLE_TLS=internal
          CONSOLE_HTTP_PORT=8098
          CONSOLE_HTTPS_PORT=8443
          CONSOLE_APP_PORT=8099
          # The port belongs in the URL: this is what reset and invite links are
          # built from, and 443 on this host is the cluster's, not the console's.
          CONSOLE_PUBLIC_URL=https://${NHDW_HOSTBASE}:8443
          CONSOLE_ENV=prod
          CONSOLE_VERIFY_TLS=true
          CONSOLE_INSECURE_HOSTS=${NHDW_HOSTBASE}
          ENV
            sudo chmod 600 "$DST/.env"
            echo "generated a fresh .env with a random database password"
          else
            # A console carrying the old development settings would hand out
            # reset links in HTTP responses. Correct that without touching the
            # password beside it.
            sudo sed -i 's/^CONSOLE_ENV=.*/CONSOLE_ENV=prod/' "$DST/.env"
            sudo grep -q '^CONSOLE_PUBLIC_URL=https' "$DST/.env" \
              || sudo sed -i "s#^CONSOLE_PUBLIC_URL=.*#CONSOLE_PUBLIC_URL=https://${NHDW_HOSTBASE}:8443#" "$DST/.env"
          fi

          cd "$DST"
          sudo docker compose up -d --build
          sudo docker compose ps --format '  {{.Service}}  {{.State}}  {{.Ports}}'
        env:
          NHDW_HOSTBASE: ${{ vars.NHDW_HOSTBASE || '20.84.70.78.nip.io' }}

      - name: Wait for it to answer
        run: |
          for i in $(seq 1 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/health || true)"
            [ "$code" = "200" ] && { echo "console healthy after ${i}0s"; exit 0; }
            sleep 10
          done
          echo "the console did not answer on :8099" >&2
          cd /opt/palladium-console && sudo docker compose logs app --tail 40
          exit 1

      - name: A way in
        run: |
          # There is no developer sign-in any more, and the accounts this
          # deployment already has were created by one — so they have no
          # password and nobody could sign in. This mints a single-use link,
          # valid for an hour, for whoever reads this log.
          cd /opt/palladium-console
          sudo docker compose exec -T app python -m app.adminctl list || true
          echo
          sudo docker compose exec -T app python -m app.adminctl invite || true
