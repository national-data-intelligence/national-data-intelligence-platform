---
# NHDW deploy — one command, inventory-driven, single node or fleet.
#
#   cd 1_infrastructure/ansible
#   ansible-playbook site.yml                              # single node (default inventory)
#   ansible-playbook -i inventory/fleet.example.yml site.yml   # fleet
#
# Stages mirror the canonical laptop boot (bundle/scripts/bootstrap.sh) but as
# inventory-driven roles. The roles WRAP the canonical scripts (cache-images / gen-secrets /
# gen-tls / sources-up / seed-realistic / seed-app-security / regen-opa-policy) and the Helm
# chart (P3) — they do not reimplement seeding or the pipeline. Laptop → fleet is one edit:
# the inventory (+ its nhdw_topology, which selects values-single vs values-fleet).
#
# Verified so far: file structure + YAML validity. End-to-end validation is P4.3 (a clean
# boot through this playbook), which needs ansible installed on the control host.

- name: Provision each node + bring up the CNI
  hosts: control_plane:workers
  gather_facts: true
  roles:
    - role: provision       # k3d today (P4); k3s server+agents from the inventory in P5
    - role: cni             # Cilium + Hubble + the node-IP-drift self-heal
    - role: images          # load bundle/images/*.tar into the node's container runtime

- name: Deploy the app tier, seed it, and verify (once, from the control plane)
  hosts: control_plane
  gather_facts: false
  run_once: true
  roles:
    - role: deploy          # external-file configMaps + secrets + `helm upgrade --install` + metrics-server
    # seed is skippable (nhdw_run_seed=false → deploy-only, e.g. re-seed a healthy cluster by hand):
    - role: seed            # sources-up + seed-realistic + seed-app-security + regen-opa (compat-gated)
      when: nhdw_run_seed | default(true) | bool
    - role: verify          # health gate: workloads Ready, every dashboard reachable, OPA enforcing
