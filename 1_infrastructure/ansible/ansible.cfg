# Ansible config for the NHDW deploy. Run from this directory:
#   ansible-playbook site.yml                         # uses inventory/single-node.yml (below)
#   ansible-playbook -i inventory/fleet.example.yml site.yml
[defaults]
inventory = inventory/single-node.yml
roles_path = roles
host_key_checking = False
# Built-in default callback — the `yaml` callback lives in a collection ansible-core doesn't
# bundle; keep the config dependency-free so a bare `pip install ansible-core` host can run it.
stdout_callback = default
gathering = smart
# The deploy/seed roles shell out to the canonical bundle/scripts/*.sh (cluster boot,
# image load, seeding) which are long-running; don't clip them on a short SSH timeout.
timeout = 60

[ssh_connection]
pipelining = True
