# ─────────────────────────────────────────────────────────────────────────────
# prometheus-gate — fronts the Prometheus expression browser. Operator-facing
# read-only observability → every ops role + superuser, from EITHER staff realm
# (R-OPS-ENG can live in moh-staff while R-OPS-ADM/R-SUPER live in privileged-ops).
# Prometheus has NO auth of its own, so this gate is the ONLY thing in front of it.
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus-gate, namespace: nhdw, labels: { app: prometheus-gate, tier: tool-sso } }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus-gate } }
  template:
    metadata: { labels: { app: prometheus-gate, tier: tool-sso } }
    spec:
      containers:
        - name: gate
          image: nhdw-registry:5500/nhdw/tool-gate:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 80, name: http } ]
          env:
            - { name: TOOL_NAME,            value: "prometheus" }
            - { name: UPSTREAM_URL,         value: "http://prometheus.nhdw.svc.cluster.local:9090" }
            - { name: ALLOWED_ROLES,        value: "R-OPS-ADM,R-OPS-ENG,R-OPS-SEC,R-SUPER" }
            - { name: OIDC_REALMS,          value: "privileged-ops,moh-staff" }
            - { name: OIDC_CLIENT_ID,       value: "prometheus" }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: prometheus-gate-secrets, key: OIDC_CLIENT_SECRET, optional: true } }
            - { name: OIDC_REDIRECT_URI,    value: "https://prometheus.127.0.0.1.nip.io/oauth2gate/callback" }
            - { name: APP_BASE,             value: "https://prometheus.127.0.0.1.nip.io" }
            - { name: KEYCLOAK_BASE,        value: "http://keycloak.nhdw.svc.cluster.local:8080" }
            - { name: KEYCLOAK_PUBLIC_BASE, value: "https://keycloak.127.0.0.1.nip.io" }
            - { name: LOKI_URL,             value: "http://loki.nhdw.svc.cluster.local:3100" }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: prometheus-gate-secrets, key: SESSION_SECRET, optional: true } }
          readinessProbe: { httpGet: { path: /oauth2gate/health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /oauth2gate/health, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus-gate, namespace: nhdw, labels: { app: prometheus-gate } }
spec:
  selector: { app: prometheus-gate }
  ports: [ { port: 80, targetPort: http, name: http } ]
