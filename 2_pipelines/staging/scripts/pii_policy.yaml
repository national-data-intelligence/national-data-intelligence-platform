# pii_policy.yaml — column-level PII policy for the processed zone (nhdw-processed).
#
# CONSUMED BY scripts/build_processed_zone.py: every populated nhdw-raw table
# is copied to nhdw-processed WITHOUT the columns listed under `drop` (plus all
# _dlt_* bookkeeping, dropped implicitly). Tables NOT listed here are SKIPPED
# loudly — unclassified data never reaches the ML-access zone (fail-safe).
# When a new source/table lands: classify it (sample REAL values!), add it here.
#
# v1 is column-DROP only (no hashing/generalisation). Principles:
#   drop  personal names + *display strings carrying names, person-level
#         identifier value+system pairs (MRN...), personal birth dates,
#         phones/emails/contact persons, data-entry/modified-by usernames,
#         free-text columns that can embed PII, whole-record blobs (a raw
#         JSON/XML column defeats column-level policy the moment the source
#         adds a contact field — mfr.raw_resource is dropped for exactly that
#         reason even though today's 1,616 rows contain no contact keys).
#   keep  opaque surrogate ids / join keys, codes, statuses, quantities,
#         facility & geography names (public infrastructure), gender,
#         non-personal dates.
# Provenance: column-by-column classification with live value sampling +
# 2-way adversarial audit (no surviving PII; no joinability breaks), 2026-07-03.
# IDSR rides the dhis2 prefix; climate is its own source — both covered.

tables:
  # ── climate ─────────────────────────────────────────────────
  climate/weekly: { drop: [] }

  # ── dhis2 ───────────────────────────────────────────────────
  dhis2/category_combos: { drop: [] }
  dhis2/category_combos__categories: { drop: [] }
  dhis2/category_combos__category_option_combos: { drop: [] }
  dhis2/category_option_combos: { drop: [] }
  dhis2/category_option_combos__category_options: { drop: [] }
  dhis2/data_element_groups: { drop: [] }
