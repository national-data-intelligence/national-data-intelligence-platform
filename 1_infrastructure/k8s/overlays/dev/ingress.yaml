# (ing-oauth2 RETIRED 2026-07-11 (#80) — the oauth2-proxy sign-in host is gone;
#  every tool now fronts itself with a tool-gate or native OIDC. See _archive/.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-mlflow
  namespace: nhdw
  # No forward-auth middleware: the mlflow-gate (nhdw/tool-gate) now does OIDC +
  # PER-ROLE enforcement itself (the shared oauth2-proxy admitted ANY session).
spec:
  ingressClassName: traefik
  tls: [ { hosts: [ mlflow.127.0.0.1.nip.io ], secretName: nhdw-wildcard-tls } ]
  rules:
    - host: mlflow.127.0.0.1.nip.io
      http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: mlflow-gate, port: { number: 80 } } } } ] }
