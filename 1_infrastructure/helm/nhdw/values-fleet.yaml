# FLEET profile. HA-leaning replicas, a real StorageClass, resource requests.
# Pairs with inventory/fleet.yml (nhdw_topology: fleet). Replace storageClass with
# your cluster's real class. Add pod anti-affinity as the fleet grows.
storageClass: nhdw-ssd
components:
  internal-bi:      { replicas: 2, resources: { requests: { cpu: 100m, memory: 128Mi } } }
  public-dashboard: { replicas: 2, resources: { requests: { cpu: 100m, memory: 128Mi } } }
  admin:            { replicas: 2, resources: { requests: { cpu: 100m, memory: 128Mi } } }
  workshop:         { replicas: 2, resources: { requests: { cpu: 100m, memory: 128Mi } } }
  gateway:          { replicas: 3, resources: { requests: { cpu: 250m, memory: 256Mi } } }
