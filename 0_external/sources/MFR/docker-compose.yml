# MFR source replica — EXTERNAL to the NHDW k8s cluster (models the Ethiopian
# Ministry of Health's Master Facility Registry). Real HAPI FHIR R4 JPA server.
#
# Real MFR is the MoH's authoritative Organisation registry (~63,805 facilities),
# exposing a FHIR R4 endpoint at https://mfr.moh.gov.et/fhir/Organization behind
# TLS + Keycloak bearer tokens. Our replica swaps the HTTPS edge for a plain HAPI
# FHIR JPA server with H2-on-disk so the demo runs offline; the dlt-MFR ingestor
# talks to the same path (/fhir/Organization) so production wiring stays identical.
#
# Offline seeding path:
#   1. docker compose -f 0_external/sources/MFR/docker-compose.yml up -d
#   2. wait until healthy  (curl :8093/fhir/metadata)
#   3. python3 0_external/sources/MFR/scripts/seed.py    (POSTs FHIR bundles: 1 country root
#      + 14 regions + 134 zones + 574 woredas + 893 facilities · ~1,616 Organizations,
#      population-weighted to the real MFR distribution — Oromia 36%, Amhara 20%, …)
#   4. bash 0_external/sources/MFR/scripts/verify.sh
# The in-cluster dlt ingestor then pulls /fhir/* over host.k3d.internal:8093.
#
# NOTE: MFR is seeded by 0_external/sources/MFR/scripts/seed.py (POST FHIR bundles) only
# AFTER the container reports healthy. It has a "missing middle" in the pipeline
# (no ch-raw-views/staging/bridge) — a lake->landing loader is needed later.
#
# Ports are published on 0.0.0.0 (NOT 127.0.0.1) so k3d pods can reach them via
# host.k3d.internal. This stack has NO nhdw_net attachment — it is the outside world.
services:
  mfr-fhir:
    image: hapiproject/hapi:v8.0.0
    container_name: nhdw-mfr-fhir
    restart: unless-stopped
    # HAPI v8 image runs as a non-root jetty user; the named docker volumes default
    # to root ownership which blocks H2 from writing its trace/MV files. Running as
    # root for a demo source-replica is fine; tighten if ever exposed publicly.
    user: "0:0"
    environment:
      # FHIR engine knobs · keep the surface narrow (Organization-only)
      hapi.fhir.fhir_version:           R4
      hapi.fhir.openapi_enabled:        "true"
      hapi.fhir.cors.allow_Credentials: "false"
      hapi.fhir.cors.allowed_origin:    "*"
      hapi.fhir.allowed_bundle_types:   "TRANSACTION,BATCH,COLLECTION"
      hapi.fhir.bulk_export_enabled:    "true"
      # H2 persistent backing store · resists container restarts. Capped heap for
      # the shared 31 GB no-swap host.
      spring.datasource.url:            "jdbc:h2:file:/data/h2/mfr;DB_CLOSE_DELAY=-1;CACHE_SIZE=131072"
      spring.datasource.username:       sa
      spring.datasource.password:       ${MFR_DB_PASSWORD:-}
      spring.datasource.driverClassName: "org.h2.Driver"
      spring.jpa.properties.hibernate.dialect: "ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect"
      JAVA_OPTS: "-Xms256m -Xmx1024m"
    ports:
      - "8093:8080"          # 0.0.0.0 — reachable from k3d pods via host.k3d.internal
    volumes:
      # Named docker volumes avoid the HAPI-container-user vs host-uid mismatch that
      # bind-mounts would otherwise hit. PERSIST across restarts AND `docker compose
      # down`. Do NOT `down -v`: wiping these and re-seeding regenerates fhir_id,
      # which is the vault hub business key — that orphans the vault.
      - mfr_h2:/data/h2
      - mfr_lucene:/var/lib/jetty/target/lucenefiles
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/fhir/metadata | grep -q resourceType || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  30
      start_period: 30s
    networks: [mfr_net]

networks:
  mfr_net:
    driver: bridge

volumes:
  mfr_h2:
  mfr_lucene:
