id: pct-map
title: PCT · Zambia supply map
kind: map
description: >-
  Zambia's provinces shaded by on-shelf availability (Global Fund S8, target 90%),
  share of facilities likely short next month, or forecast demand vs eLMIS AMC;
  every facility as a dot coloured by next-month stockout risk and sized by the
  planned order. Hollow dots are locations inferred from the district.
requires:
  subject: PRD
  verb: read
  granularity: aggregate
  sensitivity: default
