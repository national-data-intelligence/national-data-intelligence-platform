# Ingress for the dev overlay — consistent HTTPS hostnames via nip.io
# (resolves *.127.0.0.1.nip.io -> 127.0.0.1, no hosts-file edits needed).
# TLS terminates at Traefik with its default self-signed cert (browser warning
# is expected in dev). HTTPS is required so Keycloak's cross-origin session
# cookies (SameSite=None;Secure) survive the dashboard<->Keycloak OIDC handshake.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ing-keycloak, namespace: nhdw }
spec:
  ingressClassName: traefik
  tls: [ { hosts: [ keycloak.127.0.0.1.nip.io ], secretName: nhdw-wildcard-tls } ]
  rules:
    - host: keycloak.127.0.0.1.nip.io
      http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: keycloak, port: { number: 8080 } } } } ] }
