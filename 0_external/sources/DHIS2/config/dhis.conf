# DHIS2 source-replica configuration (2.40). The dhis2/core image reads this
# from DHIS2_HOME (/opt/dhis2/dhis.conf). Connects to the compose-internal
# postgis service `dhis2-db`. Demo credentials only.
connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.driver_class = org.postgresql.Driver
connection.url = jdbc:postgresql://dhis2-db:5432/dhis2
connection.username = dhis
connection.password = dhis
connection.schema = update

# Required: 24+ char key used to encrypt stored secrets.
encryption.password = nhdw-demo-dhis2-encryption-key-2026

# Server base URL (internal replica).
server.base.url = http://localhost:8080

# Keep the built-in analytics/scheduling light on the shared host.
system.monitoring_url =
