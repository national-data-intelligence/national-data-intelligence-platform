version: 2

models:
  - name: mart_consent_activity_kpi
    description: |
      Governance KPI strip — exactly three (label, value) rows: "active
      consents" (gated patients the consent gate currently serves),
      "revoked (24h)", "pending review". active consents reuses the
      consent_gate() macro over the same population the PHI marts gate,
      so the KPI and the gate cannot drift apart.
    columns:
      - name: label
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['active consents', 'revoked (24h)', 'pending review']
      - name: value
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: mart_dq_incidents
    description: >
      The durable DQ incident record on the governed mart path — one row per
      flag with events/acks counts and measured lifecycle latencies
      (hours_to_first_ack / hours_to_resolve are NULL until measured, never
      zero). Read-only reporting over the ops_governance FDW seam
      (40_dq_read.sql); the gateway remains the only writer.
    columns:
      - name: flag_id
        tests: [not_null, unique]
      - name: error_class
        tests: [not_null]
      - name: severity
        tests:
          - accepted_values:
              values: ['error', 'warn', 'info']
      - name: status
        tests: [not_null]

  - name: mart_dq_governance_kpi
    description: >
      Governance KPIs distilled from the incident history, long format
      (kpi_code, dim_a, dim_b, value_num), mirroring GET /api/dq/kpi so the
      two surfaces cannot drift. Steward KPIs stay API-only (the MDM read
      seam exposes just the decision log). Definitions:
      docs/data-quality-plane.md.
    columns:
      - name: kpi_code
        tests:
          - not_null
          - accepted_values:
              values: ['open_total', 'open_by_class', 'raised_weekly',
                       'avg_hours_to_ack', 'avg_hours_to_resolve',
                       'resolved_total', 'reopened_fingerprints']
