name: Tests (policy · data units · gateway · admin UI)

# The pre-merge regression gate — runs on GITHUB-HOSTED runners (never the
# self-hosted deploy runner) for every branch push and PR, so a defect is
# caught before it reaches develop and the live deploy. Each job mirrors a
# check that once failed silently in production:
#   policy      opa test on the committed rego (reveal sets, trust guard, scope)
#   data-units  MDM matcher passes + the security-seed loader's provenance
#               contract (psycopg3 delete-sync) + the nhdw_ref vocabulary
#               parity suite — against a real Postgres with pg_trgm
#   gateway     the whole app imports + the masking-primitive contract
#   admin-ui    tsc + vite build (type errors surface here, not mid-deploy)
#   scripts     every bundle script parses; the workflows are valid YAML

on:
  push:
    branches-ignore: [main]     # main only receives already-tested merges
  pull_request:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: opa test
        run: |
          curl -sfL -o opa https://openpolicyagent.org/downloads/v1.5.0/opa_linux_amd64_static
          chmod +x opa
          ./opa test 7_security/opa/policies

  data-units:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet 'psycopg[binary]' pyyaml
      - name: MDM matcher regression suite
        env:
          TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
          REPO_ROOT: ${{ github.workspace }}
        run: cd 2_pipelines/mdm/matcher && python3 test_matcher.py
      - name: security-seed loader provenance contract
        env:
          TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
          REPO_ROOT: ${{ github.workspace }}
        run: cd 7_security/scripts && python3 test_column_classification_loader.py
      - name: nhdw_ref vocabulary suite
        run: cd bundle/seeds/ref-vocab && python3 test_build_vocab.py

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet -r 6_access-points/api/nhdw-gateway/requirements.txt
      - name: app imports clean
        run: |
          cd 6_access-points/api/nhdw-gateway
          cp ../../../2_pipelines/ml/registry/validators.py validators.py
          python3 -c "import app.main"
      - name: masking primitives contract
        run: cd 6_access-points/api/nhdw-gateway && python3 tests/test_masking.py

  admin-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: tsc + vite build
        run: |
          cd 6_access-points/dashboards/admin/ui
          npm ci --silent
          npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every bundle script parses
        run: |
          rc=0
          for f in bundle/scripts/*.sh; do bash -n "$f" || rc=1; done
          exit $rc
      - name: workflows are valid YAML
        run: |
          python3 -c "
          import glob, yaml
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f)); print('ok', f)"
      # The provisioning playbook is the from-bare path; nothing was checking it,
      # and it had drifted from clean to four findings before anyone looked.
      - name: ansible-lint the provisioning playbook
        run: |
          pip install --quiet ansible-lint
          cd 1_infrastructure/ansible && ansible-lint .
