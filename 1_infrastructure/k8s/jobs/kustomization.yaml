# One-shot pipeline Jobs (dbt stages + source ingestors), applied per-job by
# seed-realistic.sh via `kustomize build` — NOT part of the base deploy (they
# are run-to-completion steps, not resident workloads).
#
# This kustomization exists so the CI-registry image names are remapped to the
# locally-built nhdw/*:dev images by kustomize's BUILT-IN images transform —
# the system's own mechanism — instead of a sed pass over the YAML (retired
# 2026-07-02: orchestration must not rewrite system manifests).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nhdw
resources:
  - ../base/dbt-jobs.yaml
  - ../base/ingestor-jobs.yaml

images:
  - { name: "nhdw-registry:5500/nhdw/staging-dbt",       newName: nhdw/staging-dbt,       newTag: 1.0.0 }
  - { name: "nhdw-registry:5500/nhdw/vault-dbt",         newName: nhdw/vault-dbt,         newTag: 1.0.0 }
  - { name: "nhdw-registry:5500/nhdw/vault-bridge",      newName: nhdw/vault-bridge,      newTag: 1.0.0 }
  - { name: "nhdw-registry:5500/nhdw/marts-dbt",         newName: nhdw/marts-dbt,         newTag: 1.0.0 }
  - { name: "nhdw-registry:5500/nhdw/dhis2-ingestor",    newName: nhdw/dhis2-ingestor,    newTag: 1.0.0 }
  - { name: "nhdw-registry:5500/nhdw/climate-ingestor",  newName: nhdw/climate-ingestor,  newTag: 1.0.0 }
  - { name: "nhdw-registry:5500/nhdw/ethioemr-ingestor", newName: nhdw/ethioemr-ingestor, newTag: 1.0.0 }
  - { name: "nhdw-registry:5500/nhdw/hcmiswdm-ingestor", newName: nhdw/hcmiswdm-ingestor, newTag: 1.0.0 }
  - { name: "nhdw-registry:5500/nhdw/mbrana-ingestor",   newName: nhdw/mbrana-ingestor,   newTag: 1.0.0 }
  - { name: "nhdw-registry:5500/nhdw/mfr-ingestor",      newName: nhdw/mfr-ingestor,      newTag: 1.0.0 }
  - { name: "nhdw-registry:5500/nhdw/openlmis-ingestor", newName: nhdw/openlmis-ingestor, newTag: 1.0.0 }

patches:
  # Local images are pre-imported into k3d — never pull from a registry.
  - target: { kind: Job }
    patch: |
      - { op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: IfNotPresent }
