# Local iteration overlay. Opt in explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db app
#
# The base stack bakes web/ AND app/ into the image, which is right for a
# deployment but means a CSS tweak costs a rebuild. This mounts both instead:
# saving a stylesheet is a refresh, and saving Python is a reload.
#
# app/ matters more than it looks. Without it, editing a route or schema.sql and
# restarting the container runs the OLD code from the image while reporting
# healthy — the change appears to have been applied and has not been.
services:
  app:
    volumes:
      - ./web:/srv/web:ro
      - ./app:/srv/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
