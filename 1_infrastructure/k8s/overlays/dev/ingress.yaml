# Headlamp (cluster console) — /k8s on the ADMIN host so the dashboard's
# relative link works, over TLS. Now fronted by headlamp-gate (nhdw/tool-gate),
# which does BOTH the per-role OIDC enforcement (R-OPS-* / R-SUPER) AND the
# SA-bearer injection, replacing the old two-middleware chain (oauth2-proxy
# forward-auth + the nhdw-headlamp-auth-header Traefik middleware). The gate owns
# /oauth2gate/* (its OIDC legs) and /k8s (the proxied console) on this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ing-headlamp, namespace: nhdw }
spec:
  ingressClassName: traefik
  tls: [ { hosts: [ admin.127.0.0.1.nip.io ], secretName: nhdw-wildcard-tls } ]
  rules:
    - host: admin.127.0.0.1.nip.io
      http:
        paths:
          - path: /k8s
            pathType: Prefix
            backend: { service: { name: headlamp-gate, port: { number: 80 } } }
          - path: /oauth2gate
            pathType: Prefix
            backend: { service: { name: headlamp-gate, port: { number: 80 } } }
