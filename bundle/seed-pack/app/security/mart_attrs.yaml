# ── OPA self-test fixtures (mart_attrs.py SELF_TESTS) ────────────────────
# These logical (schema, table) pairs are NOT queryable relations; they are
# the startup security-invariant fixtures the gateway asserts OPA decisions
# against (catalog↔rego drift guard). Keep them until the self-test matrix
# is repointed at real marts. Attributes reproduce the pre-reconciliation
# catalog so the invariants hold identically.
- schema_name: marts
  table_name: bi_programme_hiv_cascade_total
  subject: PRG
  data_class: DC.PRO
  granularity: aggregate
  default_sensitivity: default
  description: "Self-test fixture — PRG programme aggregate (DEC/ANA/SUPER read)."
- schema_name: marts
  table_name: bi_service_flagship_attainment
  subject: PRG
  data_class: DC.PRO
  granularity: aggregate
  default_sensitivity: default
  description: "Self-test fixture — public programme indicators (PUB-ANON reads)."
- schema_name: marts
