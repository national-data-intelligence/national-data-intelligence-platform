# SeaweedFS compatibility PROOF OF CONCEPT — Phase 1 of the MinIO migration.
#
# This is a THROWAWAY stack. It is deliberately NOT in the nhdw namespace and NOT
# on any cluster network: it exists only to answer the compatibility questions in
# the migration assessment with evidence instead of documentation. Nothing here is
# the target deployment — see 3_storage/seaweedfs/README.md once Phase 2 writes it.
#
# The four components are split exactly as the proposed target architecture splits
# them (master / volume / filer / s3), so the PoC validates the real topology
# rather than the `weed server` all-in-one shortcut, which hides failure modes.
#
# High ports (19333/18080/18888/18333) avoid every port the demo stack already
# holds — dhis2 on 8080, elmis on 5434, the source replicas on 1433/33306/8093+.
services:
  master:
    image: chrislusf/seaweedfs:${SEAWEED_TAG:-latest}
    container_name: swpoc-master
    command: "master -ip=master -ip.bind=0.0.0.0 -volumeSizeLimitMB=64"
    ports: [ "19333:9333" ]
    networks: [ swpoc ]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  volume:
    image: chrislusf/seaweedfs:${SEAWEED_TAG:-latest}
    container_name: swpoc-volume
    # -max=8 keeps the volume count bounded; -dir is the PVC equivalent in k8s.
    command: "volume -mserver=master:9333 -ip=volume -ip.bind=0.0.0.0 -port=8080 -dir=/data -max=200"
    depends_on:
      master: { condition: service_healthy }
    volumes: [ swpoc_volume:/data ]
    ports: [ "18080:8080" ]
    networks: [ swpoc ]

  filer:
    image: chrislusf/seaweedfs:${SEAWEED_TAG:-latest}
    container_name: swpoc-filer
    # Default filer store (leveldb2) for STAGE A. Stage B re-runs against the
    # PostgreSQL store to validate the architecture recommendation separately,
    # so a failure in one is never mistaken for a failure in the other.
    # EMBEDDED S3 GATEWAY (Phase 4A finding #3): the filer serves S3 on 8333 in-process.
    command: "filer -master=master:9333 -ip=filer -ip.bind=0.0.0.0 -port=8888 -s3 -s3.port=8333 -s3.ip.bind=0.0.0.0 -s3.config=/etc/seaweedfs/identities.json"
    depends_on:
      master: { condition: service_healthy }
    volumes:
      - swpoc_filer:/data
      - ./identities.json:/etc/seaweedfs/identities.json:ro
    ports: [ "18888:8888", "18333:8333" ]
    networks: [ swpoc ]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  swpoc:
    driver: bridge

volumes:
  swpoc_volume:
  swpoc_filer:
