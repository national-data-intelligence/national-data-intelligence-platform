# GPU overlay for the external Ollama — layered ON TOP of docker-compose.yml, applied
# by bundle/scripts/sources-up.sh (up_llm) ONLY when the host has an NVIDIA GPU
# (nvidia-smi). It reserves the GPU device so ollama offloads the model to it
# (qwen2.5:14b ≈ 25 tok/s on an RTX 5080 vs ~1.3 tok/s on CPU — ~20×). Requires the
# NVIDIA Container Toolkit on the host.
#
# CPU-only hosts never load this file — the base docker-compose.yml runs unchanged,
# so ONE compose serves both a CPU laptop and the RTX-5080 box. Manual bring-up with
# GPU:
#
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# (`deploy.resources.reservations.devices` is the compose-native GPU request, honored
#  by `docker compose up` when the nvidia runtime is present — equivalent to
#  `docker run --gpus all`.)
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
