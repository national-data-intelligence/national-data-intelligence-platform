# R-CONS-PRT — External Partner / Donor
#
# Authoritative spec: docs/user-roles.md §3.
# Intentional deny-all in v1. Partner access in production maps to a
# narrow per-donor mart subset (e.g. `marts_partner_pepfar.*`) which
# does not yet exist in the demo. Until then, partners are routed to
# the public dashboard only.
role:
  id: R-CONS-PRT
  name: "External Partner"
  group: Consumer
  identity_provider: MoH-Keycloak
  mfa_required: true
  mfa_factor: TOTP
  phase_activated: 1
  audit_class: enhanced
  notes: |
    Donor / partner agency access. Aggregate programme-outcome reads only
    (HLR persona: donors verify funded-programme results; the NIDP lesson —
    partners see stable, controlled, aggregated views, never raw or
    individual data). Surfaces the granted internal-bi widgets (cascades,
    flagship attainment, disease KPI strip/signal). No export, no scoped/
    individual rows, no supply/facility raw — read-only aggregate PRG.
  permissions:

    # Programme outcomes — AGGREGATE ONLY. Lights up the donor's granted
    # cascade + flagship + disease-KPI widgets (subject PRG, DC.PRO/DC.CAT)
    # without exposing any individual, raw, or scoped-sensitive data.
    - subject: PRG
      data_class: [DC.PRO, DC.CAT]
      members: all
      granularity: aggregate
      sensitivity: []
      verbs: [read]
      purpose_of_use: [public-health]
