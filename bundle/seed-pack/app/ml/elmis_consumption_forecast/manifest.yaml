# elmis_consumption_forecast — sibling of stockout_forecast on the eLMIS v2 historical lane
# (OpenLMIS source family, option (c) standalone). Landed 2026-09-10.
name: elmis_consumption_forecast
version: v1
kind: forecaster
deployment_kind: batch
engine: holt-damped-trend
provenance: holt_damped_numpy
description: >-
  Damped-trend Holt (no seasonal component — the archive holds 12 months, no yearly cycle is
  learnable) consumption forecast per facility × tracer product from
  bi_supply.mart_elmis_hist_facility_product_month, transformed to days-to-stockout
  (stock_in_hand / (forecast / 30)). Emits the flat forecast schema: district=
  "<facility_code>|<product_code>", pred_cases_*=projected monthly consumption, alarm_prob=
  stockout risk, attrs={soh_now, amc, projected_days_remaining, projected_stockout_date,
  status, method, product_name, facility_code, product_code}. Training logs a holdout MASE
  vs naive-1 on the last 3 months. Governed: facility codes are archive identities.
# No actuals block: consumption truth aligns by calendar month, not by the projection
# year/week the flat schema stores (same limitation stockout_forecast records).
