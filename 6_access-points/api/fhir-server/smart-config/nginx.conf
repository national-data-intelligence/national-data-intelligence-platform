worker_processes 1;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream hapi {
        server fhir-server:8080;
    }

    server {
        listen 80;
        server_name _;

        # P4.2 SMART configuration endpoint. Static JSON; HAPI never sees this path.
        location = /fhir/.well-known/smart-configuration {
            default_type application/json;
            add_header Cache-Control "public, max-age=300" always;
            alias /usr/share/nginx/html/fhir/.well-known/smart-configuration;
        }

        # Everything else → HAPI.
        location / {
            proxy_pass http://hapi;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
