version: 2

seeds:
  - name: commodity_reference
    description: |
      GENERATED by bundle/seeds/entity-model/build_sample.py from the
      commodities catalogue — edit entity-model.yaml, never this CSV. One row
      per commodity: programme_id (the Resource pages' programme-filter join)
      and enables_indicator (the HMIS service the commodity POWERS — empty =
      no clean linkage, service impact stays an honest NULL).
    columns:
      - name: commodity_id
        tests: [not_null, unique]
      - name: commodity_name
        tests: [not_null, unique]
      - name: programme_id
        tests: [not_null]
  - name: disease_response_map
    description: |
      GENERATED by bundle/seeds/entity-model/build_sample.py from the
      disease_response section of entity-model.yaml — edit the model, never
      this CSV. Maps IDSR disease codes to tracked response commodities
      (role: treatment/diagnostic/prevention/supportive). Diseases with no
      tracked countermeasure (MEN, RELF) are deliberately absent.
    columns:
      - name: disease_code
        tests: [not_null]
      - name: commodity_id
        tests: [not_null]
      - name: commodity_name
        tests: [not_null]
      - name: role
        tests:
          - not_null
          - accepted_values:
              values: [treatment, diagnostic, prevention, supportive]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [disease_code, commodity_id]
  - name: epss_hub_catchment
    description: |
      GENERATED by bundle/seeds/entity-model/build_sample.py from the `serves`
      catchment lists on entity-model.yaml epss_hubs — edit the model, never
      this CSV. weight = the region's facility share within the hub's
      catchment (Σ weights = 1 per hub). Every one of the 14 regions appears;
      CE/SW are served by Adama/Shashemene/Hawassa and Jimma/Sodo.
    columns:
      - name: hub_id
        tests: [not_null]
      - name: region_id
        tests: [not_null]
      - name: weight
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0 AND weight <= 1"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [hub_id, region_id]

models:
  - name: mart_supply_region_stock
    description: |
      Month × commodity × REGION months-on-hand (mos from catchment-blended
      soh/amc), from HCMIS hub stock events allocated through the
      epss_hub_catchment seed (hubs serve multi-region catchments — CE/SW
      have no hub of their own). Backs rm-stock-heatmap and the readiness
      leg of dz-region-map. Covers all 14 regions.
    columns:
      - name: month_id
        tests: [not_null]
      - name: commodity_name
        tests: [not_null]
      - name: region_id
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [month_id, commodity_name, region_id]
  - name: mart_supply_stockout_events
    description: |
      One row per stockout EPISODE (contiguous zero-stock months for a
      HUB × commodity, gaps-and-islands over monthly SOH) × affected region
      (exploded through epss_hub_catchment — a region-scoped user sees the
      hub outages that threaten their supply; hub_id/hub_name carry the
      physical location). Backs rm-events. May be sparse when stock is
      healthy (honest empty).
    columns:
      - name: episode_id
        tests: [not_null, unique]
      - name: region_id
        tests: [not_null]
      - name: hub_id
        tests: [not_null]
      - name: commodity_name
        tests: [not_null]
  - name: mart_supply_outbreak_response
    description: |
      "Act this week" — outbreak pressure (IDSR 4-week signal + trend) ×
      response-commodity stock (catchment-blended latest-month mos), joined
      through disease_response_map. commodity NULL = no tracked
      countermeasure (honest absence). act_score ranks by cases × supply
      severity. Backs rm-act-week.
    columns:
      - name: region_id
        tests: [not_null]
      - name: disease_code
        tests: [not_null]
      - name: cases_4w
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: supply_status
        tests:
          - not_null
          - accepted_values:
              values: [stockout, critical, tight, ok, no_countermeasure, no_stock_data]
      - name: act_score
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_id, disease_code, commodity_id]

  - name: mart_stockout_service_impact
    description: |
      Stockout cost in services per (region × commodity): days_out (12-month
      window) × the enabled indicator's avg monthly regional volume / 30.
      est_missed_services is DERIVED or NULL (no enables linkage), never
      guessed — consumers must label it an estimate. Backs rm-stockout-impact.
    columns:
      - name: region_id
        tests: [not_null]
      - name: commodity_name
        tests: [not_null]
      - name: days_out_12m
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: est_missed_services
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 OR est_missed_services IS NULL"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_id, commodity_name]

  - name: mart_resource_allocation
    description: |
      Per (month × commodity) stock + consumption + wastage, NATIONAL —
      the HCMIS stock-event link has no facility FK, so there is no
      per-facility cut. Computes months-of-supply (mos) = soh_eom_avg /
      amc. Source for the stockout forecast model + the supply-chain
      dashboard (gateway fetchers treat it as national, geo_col=None).
    columns:
      - name: month_id
        description: "Month bucket as text (YYYY-MM)."
        tests: [not_null]
      - name: commodity_name
        tests: [not_null]
      - name: amc
        description: "12-month moving average consumption."
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 OR amc IS NULL"
      - name: soh_eom_avg
        description: "Stock on hand, averaged across env/mode/day rows in the month."
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 OR soh_eom_avg IS NULL"
      - name: stockout_days
        description: "Days in the month with at least one zero-SOH stock event nationwide."
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 AND stockout_days <= 31"
      - name: mos
        description: "Months of supply at month end. NULL when amc is 0/NULL."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [month_id, commodity_name]

  - name: mart_supply_stockout_forecast
    description: |
      Per (facility-env × commodity) days-to-stockout projection using
      AMC-12. Status: stockout (≤0d), risk (1-14d), watch (15-30d), ok (>30d).
    columns:
      - name: commodity_name
        tests: [not_null]
      - name: hk_hcmis_environment
        description: "Hash key for the facility's stocking environment (cold-chain / dry)."
        tests: [not_null]
      - name: as_of
        description: "Snapshot date for the projection's starting SOH."
        tests: [not_null]
      - name: soh_now
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: projected_days_remaining
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 OR projected_days_remaining IS NULL"
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: [stockout, risk, watch, ok]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [hk_hcmis_environment, commodity_name]

  - name: mart_supply_stockout_public
    description: |
      K-anonymised public view — facility counts per region. n_facilities
      is the total reporting facilities (k>=5 enforced); n_stocked is how
      many had non-zero SOH; stocked_pct is the public-facing rate.
    columns:
      - name: region_name
        tests: [not_null, unique]
      - name: n_facilities
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 5"
      - name: n_stocked
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: stocked_pct
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 AND stocked_pct <= 100 OR stocked_pct IS NULL"

  - name: mart_supply_pipeline
    description: |
      Vaccine procurement pipeline — one row per OPEN purchase order (HCMIS
      Vaccine.PurchaseOrder), with commodity name + destination-hub region and a
      LIVE eta_days (expected_delivery_date − CURRENT_DATE). Backs rm-pipeline.
    columns:
      - name: po_id
        tests: [not_null, unique]
      - name: commodity_name
        tests: [not_null]
      - name: qty
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: [Ordered, In Transit, At Customs]

  # ── Supply Control Tower (EPSS dispatch plan) ─────────────────────────────
  - name: mart_ct_nodes
    description: |
      Every EPSS hub (warehouse) and delivery facility in the dispatch plan,
      one row each (node_kind = hub|facility). Reproduces plan.ts WAREHOUSES +
      NODES; region_id conforms the plan region name to the bi_supply 2-letter
      code for OPA geo scoping. Backs ct-movement / ct-dispatch (via /api/ct/plan).
    columns:
      - name: node_kind
        tests:
          - not_null
          - accepted_values: {values: [hub, facility]}
      - name: node_id
        tests: [not_null, unique]
      - name: name
        tests: [not_null]
  - name: mart_ct_movements
    description: |
      One row per dispatch movement line (hub → facility × commodity × period),
      reproducing plan.ts MOVEMENTS. region_id enables geography scoping;
      programme_id conforms via commodity_reference; why_json holds the nested
      demand-signal breakdown. Backs ct-movement / ct-kpis.
    columns:
      - name: movement_id
        tests: [not_null, unique]
      - name: period_id
        tests: [not_null]
      - name: from_hub_id
        tests: [not_null]
      - name: to_node_id
        tests: [not_null]
      - name: commodity_key
        tests: [not_null]
      - name: reason
        tests:
          - not_null
          - accepted_values: {values: [nearest, capacity-overflow]}
  - name: mart_ct_vehicle_runs
    description: |
      One row per dispatch vehicle run, reproducing plan.ts VEHICLE_RUNS. The
      per-run stop list + road polyline ride as JSON (stops_json / path_json).
      Backs ct-dispatch and the selected-run overlay on ct-movement.
    columns:
      - name: run_id
        tests: [not_null, unique]
      - name: period_id
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values: {values: [Dispatched, Loading, Planned, Delivered]}
  - name: mart_ct_plan_stats
    description: |
      Per-period plan-level KPI + savings summary (units/legs/runs/facilities/
      fill + km/cost/vehicles saved vs a naive one-truck-per-facility baseline).
      Reproduces plan.ts PERIOD_STATS and, for the current period, SUMMARY +
      BASELINE verbatim. Served as summary/baseline/periodStats by /api/ct/plan.
    columns:
      - name: period_id
        tests: [not_null, unique]
      - name: label
        tests: [not_null]
      - name: units
        tests: [not_null]

  # ── eLMIS v2 history (OpenLMIS family, lane 2; option (c) standalone — never joins the entity model) ──
  - name: mart_elmis_hist_monthly_activity
    description: |
      Legacy eLMIS v2 history — month × programme national supply activity
      (requisitions, dispensed/AMC, fill rate, stockout days) across 173
      monthly periods from Jan 2013. Aggregated once from 7.5M R&R lines
      (table materialization). Added 2026-08-31.
    columns:
      - name: month_id
        tests: [not_null]
      - name: programme_name
        tests: [not_null]
      - name: requisitions
        tests: [not_null]

  - name: mart_elmis_hist_product_stockout
    description: |
      Legacy eLMIS v2 history — month × tracer product stockout pressure
      (stockout days, share of lines out of stock, dispensed volume).
    columns:
      - name: month_id
        tests: [not_null]
      - name: product_name
        tests: [not_null]

  - name: mart_elmis_hist_facility_activity
    description: |
      Legacy eLMIS v2 history — facility × programme × month rollup with
      zone context (≤74k rows). GOVERNED: facility identities derive from a
      restricted known-entity dump — internal display only pending data-owner
      clearance.
    columns:
      - name: facility_code
        tests: [not_null]
      - name: month_id
        tests: [not_null]

  - name: mart_elmis_hist_availability
    description: |
      "Period availability" (the OSA-PROXY — never labeled OSA) per month ×
      product set (tracer / ppe) × product: share of non-skipped reporting
      lines in stock with zero stockout days. PPE list pending user review.
    columns:
      - name: month_id
        tests: [not_null]
      - name: availability_pct
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 AND availability_pct <= 100 OR availability_pct IS NULL"

  - name: mart_elmis_hist_timeliness
    description: |
      Facility reporting timeliness per month × programme — on-time =
      requisition created within 15 days of period end (P1 baseline 79.8%).
    columns:
      - name: month_id
        tests: [not_null]
      - name: on_time_pct
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 AND on_time_pct <= 100 OR on_time_pct IS NULL"

  - name: mart_elmis_hist_satp
    description: |
      Stock According To Plan (facility-grain ADAPTATION of the GF central-
      store measure) per month × programme: lines banded stocked_out /
      understocked / according / overstocked via amc and max_stock_quantity.
    columns:
      - name: month_id
        tests: [not_null]
      - name: satp_pct
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 AND satp_pct <= 100 OR satp_pct IS NULL"

  - name: mart_elmis_hist_facility_product_month
    description: "eLMIS v2 history — facility × product × month (non-skipped lines): the feature mart for elmis_consumption_forecast and the base of the resupply plan. Governed (facility codes)."
    columns:
      - name: facility_code
        tests: [not_null]
      - name: product_code
        tests: [not_null]
      - name: month_id
        tests: [not_null]
  - name: mart_elmis_hist_resupply_plan
    description: "eLMIS v2 history — planning-module mock: latest-month stock position, months of stock, suggested resupply quantity and SATP band per facility × tracer product."
    columns:
      - name: plan_band
        tests:
          - accepted_values:
              arguments: { values: ['stocked_out', 'understocked', 'according_to_plan', 'overstocked'] }
