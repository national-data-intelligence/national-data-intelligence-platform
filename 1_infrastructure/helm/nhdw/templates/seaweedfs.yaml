# SeaweedFS — S3 object storage for the lake (replaces minio-datalake; migration
# assessment + Phase 1 evidence in 3_storage/seaweedfs/). Four components, split the
# way SeaweedFS itself splits them, so each can be probed and fail independently:
#
#   master  — topology + volume placement. Small state on its own PVC.
#   volume  — the bytes. StatefulSet so its DNS name is stable (it registers that
#             name with the master and every reader dials it directly).
#   filer   — S3 key → chunk metadata. STATELESS here: the store is a database in
#             postgres-vault (3_storage/postgres/init/23_seaweedfs_filer_db.sh), so
#             filer metadata rides the existing Postgres backup instead of a second one.
#   s3      — the S3 API on :8333. Identities (the whole IAM surface) come from a
#             mounted Secret, not from runtime `mc admin` calls.
#
# COEXISTENCE: nothing here touches minio-datalake. Consumers keep pointing at
# minio-datalake:9000 until Phase 6/7 (see 3_storage/seaweedfs/README.md — cutover is
# a Service alias swap, rollback is the same swap back).
#
# Phase 1 findings baked in (do not "simplify" these away):
#   * -max on the volume server must exceed bucket-count × volumes-per-bucket —
#     SeaweedFS allocates a volume COLLECTION PER BUCKET (the PoC hit "no free
#     volumes" at 8 with 7 buckets).
#   * the filer's Postgres table is NOT auto-created and MUST be COLLATE "C"
#     (init script above) or S3 list order is not byte-lexicographic.
#   * identity prefix grants need the `bucket/prefix/*` glob form; the bare form
#     fails CLOSED (denies everything).
{{- $sw := .Values.seaweedfs }}
{{- /* s3 gateway is embedded in the filer since Phase 4A; $sw.s3.resources is retained for compatibility but unused */ -}}
{{- $img := printf "chrislusf/seaweedfs:%s" $sw.tag }}
# ─── master ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: seaweedfs-master-data, namespace: {{ .Values.namespace }} }
spec:
  accessModes: [ ReadWriteOnce ]
  storageClassName: {{ .Values.storageClass }}
  resources: { requests: { storage: {{ $sw.master.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: seaweedfs-master, namespace: {{ .Values.namespace }}, labels: { app: seaweedfs-master, tier: storage, part-of: seaweedfs } }
spec:
  replicas: 1
  strategy: { type: Recreate }        # RWO PVC — never two masters on one dir
  selector: { matchLabels: { app: seaweedfs-master } }
  template:
    metadata: { labels: { app: seaweedfs-master, tier: storage, part-of: seaweedfs } }
    spec:
      containers:
        - name: master
          image: {{ $img }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - master
            - -ip=seaweedfs-master
            - -ip.bind=0.0.0.0
            - -port=9333
            - -mdir=/data
            - -volumeSizeLimitMB={{ $sw.volumeSizeLimitMB }}
            - -defaultReplication={{ $sw.replication }}
          ports:
            - { containerPort: 9333,  name: http }
            - { containerPort: 19333, name: grpc }
          volumeMounts: [ { name: data, mountPath: /data } ]
          readinessProbe:
            httpGet: { path: /cluster/status, port: 9333 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /cluster/status, port: 9333 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources: {{ toYaml $sw.master.resources | nindent 12 }}
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: seaweedfs-master-data } }
---
apiVersion: v1
kind: Service
metadata: { name: seaweedfs-master, namespace: {{ .Values.namespace }}, labels: { app: seaweedfs-master, part-of: seaweedfs } }
spec:
  selector: { app: seaweedfs-master }
  ports:
    - { port: 9333,  targetPort: http, name: http }
    - { port: 19333, targetPort: grpc, name: grpc }
---
# ─── volume server ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata: { name: seaweedfs-volume, namespace: {{ .Values.namespace }}, labels: { app: seaweedfs-volume, part-of: seaweedfs } }
spec:
  clusterIP: None                     # headless: stable per-pod DNS for -ip
  selector: { app: seaweedfs-volume }
  ports:
    - { port: 8080,  targetPort: http, name: http }
    - { port: 18080, targetPort: grpc, name: grpc }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: seaweedfs-volume, namespace: {{ .Values.namespace }}, labels: { app: seaweedfs-volume, tier: storage, part-of: seaweedfs } }
spec:
  serviceName: seaweedfs-volume
  replicas: 1
  selector: { matchLabels: { app: seaweedfs-volume } }
  template:
    metadata: { labels: { app: seaweedfs-volume, tier: storage, part-of: seaweedfs } }
    spec:
      containers:
        - name: volume
          image: {{ $img }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          args:
            - volume
            - -mserver=seaweedfs-master:9333
            - -ip=$(POD_NAME).seaweedfs-volume
            - -ip.bind=0.0.0.0
            - -port=8080
            - -dir=/data
            - -max={{ $sw.volume.maxVolumes }}
            - -dataCenter=dc1
            - -rack=rack1
          ports:
            - { containerPort: 8080,  name: http }
            - { containerPort: 18080, name: grpc }
          volumeMounts: [ { name: data, mountPath: /data } ]
          readinessProbe:
            httpGet: { path: /status, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /status, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources: {{ toYaml $sw.volume.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ ReadWriteOnce ]
        storageClassName: {{ .Values.storageClass }}
        resources: { requests: { storage: {{ $sw.volume.storage }} } }
---
# ─── filer (metadata → postgres-vault) ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: seaweedfs-filer, namespace: {{ .Values.namespace }}, labels: { app: seaweedfs-filer, tier: storage, part-of: seaweedfs } }
spec:
  replicas: 1
  # Phase 4A finding (2026-09-08), two parts, both required:
  #  * the filer's registered identity MUST be unique per pod (its pod IP, below). It
  #    first announced itself as `seaweedfs-filer:8888` (the Service name); the master
  #    only notices a departed pod ~15 s later, by heartbeat timeout, and that late
  #    "leave" removed the NEW pod's entry of the same name from the lock ring. Ring
  #    → [] and every S3 write failed with "no lock server found" while reads kept
  #    working. Recreate alone did not fix it — the leave still arrives after the join.
  #  * Recreate, so two filers never run at once against one Postgres store.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: seaweedfs-filer } }
  template:
    metadata: { labels: { app: seaweedfs-filer, tier: storage, part-of: seaweedfs } }
    spec:
      containers:
        - name: filer
          image: {{ $img }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            # Store selection. LEVELDB2 must be explicitly OFF or the filer keeps
            # its embedded store and the Postgres config is silently ignored.
            - { name: WEED_LEVELDB2_ENABLED,  value: "false" }
            - { name: WEED_POSTGRES_ENABLED,  value: "true" }
            - { name: WEED_POSTGRES_HOSTNAME, value: "postgres-vault.{{ .Values.namespace }}.svc.cluster.local" }
            - { name: WEED_POSTGRES_PORT,     value: "5432" }
            - { name: WEED_POSTGRES_DATABASE, value: {{ $sw.filer.database | quote }} }
            - { name: WEED_POSTGRES_USERNAME, value: {{ $sw.filer.dbUser | quote }} }
            - { name: WEED_POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: seaweedfs-secrets, key: FILER_DB_PASSWORD } } }
            - { name: WEED_POSTGRES_SSLMODE,  value: "disable" }
            - { name: WEED_POSTGRES_CONNECTION_MAX_IDLE, value: "5" }
            - { name: WEED_POSTGRES_CONNECTION_MAX_OPEN, value: "20" }
          args:
            - filer
            - -master=seaweedfs-master:9333
            - -ip=$(POD_IP)            # unique per pod — see the strategy note above
            - -ip.bind=0.0.0.0
            - -port=8888
            - -defaultReplicaPlacement={{ $sw.replication }}
            # The S3 gateway runs INSIDE the filer process (SeaweedFS's own supported mode).
            # Phase 4A finding #3: a standalone gateway learns filer addresses from the
            # master on a ~5-minute tick, so after a filer restart it kept dialling the old
            # pod IP and every write failed for up to five minutes while health stayed
            # green. In-process, the gateway can never hold a stale address for its own
            # filer and the two restart as one. Consumers still use seaweedfs-s3:8333.
            - -s3
            - -s3.port=8333
            - -s3.ip.bind=0.0.0.0
            - -s3.config=/etc/seaweedfs/identities.json
          ports:
            - { containerPort: 8888,  name: http }
            - { containerPort: 18888, name: grpc }
            - { containerPort: 8333,  name: s3 }
          readinessProbe:
            httpGet: { path: /, port: 8888 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8888 }
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - { name: identities, mountPath: /etc/seaweedfs, readOnly: true }
          resources: {{ toYaml $sw.filer.resources | nindent 12 }}
      volumes:
        - name: identities
          secret:
            secretName: seaweedfs-secrets
            items: [ { key: identities.json, path: identities.json } ]
---
apiVersion: v1
kind: Service
metadata: { name: seaweedfs-filer, namespace: {{ .Values.namespace }}, labels: { app: seaweedfs-filer, part-of: seaweedfs } }
spec:
  selector: { app: seaweedfs-filer }
  ports:
    - { port: 8888,  targetPort: http, name: http }
    - { port: 18888, targetPort: grpc, name: grpc }
---
# ─── S3 endpoint ──────────────────────────────────────────────────────────────
# No standalone gateway Deployment: the gateway is embedded in the filer (see the
# filer args). This Service keeps the endpoint name and port every consumer and
# the Phase 7 cutover alias use — seaweedfs-s3:8333 — and selects the filer pod.
---
apiVersion: v1
kind: Service
metadata: { name: seaweedfs-s3, namespace: {{ .Values.namespace }}, labels: { app: seaweedfs-s3, part-of: seaweedfs } }
spec:
  selector: { app: seaweedfs-filer }
  ports:
    - { port: 8333, targetPort: s3, name: s3 }
---
# ─── seaweedfs-init · buckets, versioning, lifecycle ──────────────────────────
# The port of minio-init. Everything that was `mc admin …` (users, policies,
# anonymous) is GONE — those are static identities in seaweedfs-secrets now. What
# remains is pure S3 (mb / version / ilm), which Phase 1 proved SeaweedFS accepts.
# `mc` is kept as the client because it is already in the offline image bundle;
# retiring it for a boto3 script is Phase 8 (decommission) housekeeping.
apiVersion: batch/v1
kind: Job
metadata: { name: seaweedfs-init, namespace: {{ .Values.namespace }}, labels: { app: seaweedfs-init, tier: pipeline, part-of: seaweedfs } }
spec:
  backoffLimit: 2
  template:
    metadata: { labels: { app: seaweedfs-init, tier: pipeline, part-of: seaweedfs } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-08T15-39-49Z
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              set -eu
              EP="http://seaweedfs-s3.{{ .Values.namespace }}.svc.cluster.local:8333"
              for i in $(seq 1 30); do
                mc alias set sw "$EP" "$SW_ADMIN_ACCESS_KEY" "$SW_ADMIN_SECRET_KEY" >/dev/null 2>&1 && break
                echo "  … waiting for $EP ($i)"; sleep 5
              done
              for b in nhdw-raw nhdw-processed nhdw-archive nhdw-lake nhdw-exports \
                       nhdw-artifacts nhdw-backups nhdw-static nhdw-logs nhdw-docs; do
                mc mb --ignore-existing "sw/$b" >/dev/null
                echo "  ✓ bucket $b ready"
              done
              # Overwrite protection on the zones that are hard to regenerate.
              for b in nhdw-raw nhdw-archive nhdw-artifacts nhdw-backups; do
                mc version enable "sw/$b" >/dev/null || echo "  ! versioning not enabled on $b"
              done
              # Retention. The legacy `mc ilm add --id` form runs FIRST so the rule IDs
              # match MinIO's (exports-ttl-90d / backups-ttl-365d) and an audit lines
              # up; `mc ilm rule add` (verified against SeaweedFS in Phase 2) is the
              # fallback and assigns an auto-generated ID. Idempotent either way.
              mc ilm add --expiry-days 90  --id exports-ttl-90d  "sw/nhdw-exports" >/dev/null 2>&1 \
                || mc ilm rule add --expire-days 90  "sw/nhdw-exports" >/dev/null 2>&1 || echo "  ! ilm nhdw-exports"
              mc ilm add --expiry-days 365 --id backups-ttl-365d "sw/nhdw-backups" >/dev/null 2>&1 \
                || mc ilm rule add --expire-days 365 "sw/nhdw-backups" >/dev/null 2>&1 || echo "  ! ilm nhdw-backups"
              echo "seaweedfs-init complete"
              mc ls sw
          env:
            - { name: SW_ADMIN_ACCESS_KEY, valueFrom: { secretKeyRef: { name: seaweedfs-secrets, key: ADMIN_ACCESS_KEY } } }
            - { name: SW_ADMIN_SECRET_KEY, valueFrom: { secretKeyRef: { name: seaweedfs-secrets, key: ADMIN_SECRET_KEY } } }
