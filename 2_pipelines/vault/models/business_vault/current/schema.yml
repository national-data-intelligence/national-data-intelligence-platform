# Hand-maintained (business vault is outside gen-vault-tests.py scope).
# Current-record layer: one view per raw-vault satellite, DISTINCT ON the
# hash key ORDER BY load_ts DESC. The unique test on the hash key IS the
# layer's contract — exactly one row per hash key at any history depth.

models:
  - name: v_sat_climate_week_current
    description: 'Latest sat_climate_week record per hash key (current-record view).'
    columns:
      - name: hk_climate_week
        description: 'Hash key — PK of the view; exactly one row each.'
        tests:
          - not_null
          - unique
