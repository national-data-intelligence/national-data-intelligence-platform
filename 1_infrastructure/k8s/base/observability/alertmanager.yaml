# Alertmanager (#81) — single replica, ephemeral (emptyDir). Receives alerts
# from Prometheus (alerting.alertmanagers in prometheus.yaml) and routes every
# notification to the SAME external Google SMTP relay the gateway's app mailer
# uses (smtp-secrets) — one centralised mail path, no in-cluster sink. A fired
# platform alert is visible three ways: the gateway's /api/alerts/active feed
# (routes/alerts.py pulls from the Alertmanager API), the Alertmanager UI, and a
# real email in the relay account's inbox. (Mailpit retired 2026-07-06.)
#
# WIRING CONTRACTS:
#   * Service DNS  alertmanager.nhdw.svc.cluster.local:9093  ← the gateway's
#     optional ALERTMANAGER_URL (routes/alerts.py) and Prometheus' alerting block.
#   * SMTP → external Google relay. The global smtp_* block is RENDERED at pod
#     start by the `render-config` initContainer from the gitignored smtp-secrets
#     Secret (SMTP_HOST/PORT/USER/PASS/FROM). Absent/empty secret ⇒ a null
#     receiver (no email) so Alertmanager still boots — the send just no-ops
#     instead of crash-looping on a missing smarthost.
apiVersion: apps/v1
kind: Deployment
metadata: { name: alertmanager, namespace: nhdw, labels: { app: alertmanager, tier: observability } }
spec:
  replicas: 1
  selector: { matchLabels: { app: alertmanager } }
  template:
    metadata: { labels: { app: alertmanager, tier: observability } }
    spec:
      securityContext: { runAsUser: 65534, runAsNonRoot: true, fsGroup: 65534 }
      initContainers:
        # Render alertmanager.yml from smtp-secrets. Uses the alertmanager image
        # itself (busybox /bin/sh — no extra image to cache offline). The heredoc
        # env-expands ${SMTP_*}; the recipient is the relay account (SMTP_USER) so
        # the alert lands in a REAL, viewable inbox. No creds ⇒ null receiver.
        - name: render-config
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              OUT=/rendered/alertmanager.yml
              if [ -n "${SMTP_HOST:-}" ] && [ -n "${SMTP_USER:-}" ]; then
                echo "render-config: SMTP relay ${SMTP_HOST}:${SMTP_PORT:-587} → ${SMTP_USER}"
                cat > "$OUT" <<EOF
              global:
                resolve_timeout: 5m
                smtp_smarthost: "${SMTP_HOST}:${SMTP_PORT:-587}"
                smtp_from: "${SMTP_FROM:-alerts@nhdw.moh.gov.et}"
                smtp_auth_username: "${SMTP_USER}"
                smtp_auth_password: "${SMTP_PASS:-}"
                smtp_require_tls: true
              route:
                group_by: ["alertname", "service"]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 3h
                receiver: email
                routes:
                  - matchers: [ 'alertname = "Watchdog"' ]
                    receiver: email
                    repeat_interval: 12h
              receivers:
                - name: email
                  email_configs:
                    - to: "${SMTP_USER}"
                      send_resolved: true
                      require_tls: true
              inhibit_rules:
                - source_matchers: [ 'severity = "critical"' ]
                  target_matchers: [ 'severity = "warning"' ]
                  equal: ["service"]
              EOF
              else
                echo "render-config: no SMTP creds → null receiver (email disabled)"
                cat > "$OUT" <<'EOF'
              global:
                resolve_timeout: 5m
              route:
                group_by: ["alertname", "service"]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 3h
                receiver: "null"
              receivers:
                - name: "null"
              inhibit_rules:
                - source_matchers: [ 'severity = "critical"' ]
                  target_matchers: [ 'severity = "warning"' ]
                  equal: ["service"]
              EOF
              fi
          env:
            - { name: SMTP_HOST, valueFrom: { secretKeyRef: { name: smtp-secrets, key: SMTP_HOST, optional: true } } }
            - { name: SMTP_PORT, valueFrom: { secretKeyRef: { name: smtp-secrets, key: SMTP_PORT, optional: true } } }
            - { name: SMTP_USER, valueFrom: { secretKeyRef: { name: smtp-secrets, key: SMTP_USER, optional: true } } }
            - { name: SMTP_PASS, valueFrom: { secretKeyRef: { name: smtp-secrets, key: SMTP_PASS, optional: true } } }
            - { name: SMTP_FROM, valueFrom: { secretKeyRef: { name: smtp-secrets, key: SMTP_FROM, optional: true } } }
          volumeMounts:
            - { name: config, mountPath: /rendered }
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports: [ { name: http, containerPort: 9093 } ]
          readinessProbe: { httpGet: { path: /-/ready,   port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /-/healthy, port: http }, initialDelaySeconds: 20, periodSeconds: 15 }
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "128Mi" }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data,   mountPath: /alertmanager }
      volumes:
        - { name: config, emptyDir: {} }
        - { name: data,   emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: alertmanager, namespace: nhdw, labels: { app: alertmanager, tier: observability } }
spec:
  selector: { app: alertmanager }
  ports: [ { name: http, port: 9093, targetPort: http } ]
