# NHDW Helm values — the per-environment knobs. The topology profiles
# (values-single.yaml / values-fleet.yaml) override these; "laptop → fleet" is a
# `-f values-fleet.yaml` swap, no template changes. See README.md.
namespace: nhdw

image:
  # dev (k3d-loaded images): "nhdw" → nhdw/<component>:<tag>.
  # prod: a real registry, e.g. "registry.example.com/nhdw".
  repository: nhdw
  tag: "1.0.0"                 # immutable release version (P2.1) — bump per release, matches VERSION
  pullPolicy: IfNotPresent

# Consistent-hostname base for OIDC redirects + ingress hosts (the OIDC consistent-hostname contract).
hostBase: 127.0.0.1.nip.io
keycloak:
  # publicBase derives from hostBase (https://keycloak.<hostBase>) via the nhdw.kcPublicBase
  # helper — leave empty so ONE hostBase knob moves the whole OIDC issuer. Set only to override.
  publicBase: ""
  internalBase: http://keycloak.nhdw.svc.cluster.local:8080
fayda:
  internalBase: http://host.k3d.internal:8096   # external Fayda replica (email-OTP); prod → real Fayda

# Alertmanager email is opt-IN. Default false ⇒ a from-bare/cold rebuild renders a null
# receiver and NEVER emails a real inbox, even though smtp-secrets carries a live app-password.
# Set true only when you deliberately want live alert emails.
alertmanager:
  email: false

# ── OpenMetadata (catalog / glossary / column lineage — 6_access-points reads it,
# OPA never does). On by default on this host (headroom measured); set false on
# constrained fleet machines. OpenSearch exists only as OM's search backend.
openmetadata:
  enabled: true
  tag: "2.0.2"
  opensearchTag: "2.19.6"

storageClass: local-path

# ── SeaweedFS (object storage — see 3_storage/seaweedfs/) ──
# Tag pinned to the exact image Phase 1 validated (digest fc9f76fa…). Bump only
# after re-running 3_storage/seaweedfs/poc/compat_test.py against the new tag.
seaweedfs:
  tag: "4.45"
  replication: "000"          # single volume server → no replica. Raise ONLY with >1 volume pod.
  volumeSizeLimitMB: 1024     # size of one volume file; many small volumes = finer placement
  master: { storage: 1Gi,  resources: {} }
  volume:
    storage: 20Gi             # MinIO's PVC is 10Gi at 75 MB used; room for the copy + growth
    # MEASURED in Phase 3 (not a guess): SeaweedFS pre-allocates 7 volumes PER BUCKET
    # the moment the bucket is first written, regardless of data volume — 5 buckets
    # holding 49 MB occupied 47 volumes. When the cap is hit, puts do not fail
    # cleanly: the gateway retries with backoff (~5 s per object) and eventually
    # hangs. The PoC hit this twice, at 8 and at 40.
    #   minimum = 7 × (buckets + 1 default collection) = 7 × 11 = 77 for our 10 buckets
    #   200 leaves room for growth; a volume only consumes the disk it actually holds,
    #   so this is NOT a 200 GB reservation. Watch `Free` on the master's /dir/status.
    maxVolumes: 200
    resources: {}
  filer:
    database: seaweedfs_filer  # in postgres-vault (3_storage/postgres/init/23_seaweedfs_filer_db.sh)
    dbUser: seaweedfs_filer
    resources: {}
  s3: { resources: {} }

# Per-component replicas + resources. Fleet profile raises these.
components:
  internal-bi:      { replicas: 1, resources: {} }
  public-dashboard: { replicas: 1, resources: {} }
  admin:            { replicas: 1, resources: {} }
  workshop:         { replicas: 1, resources: {} }
  gateway:          { replicas: 1, resources: {} }

# Active country profile (directory name under /opt/nhdw-profiles on the host).
# This is only the FALLBACK: the ACTIVE pointer file in that directory wins, so a
# demo profile swap is a file write rather than a helm upgrade.
profile: et-v3
