apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhdw-gateway
  namespace: nhdw
  labels: { app: nhdw-gateway, tier: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nhdw-gateway }
  template:
    metadata:
      labels: { app: nhdw-gateway, tier: api }
    spec:
      serviceAccountName: nhdw-gateway
      containers:
        - name: gateway
          image: nhdw-registry:5500/nhdw/gateway:1.0.0
          imagePullPolicy: Always
          ports: [ { containerPort: 8000, name: http } ]
          # Resource requests are the HPA's scaling baseline (target = % of the
          # requested CPU). Modest request so a traffic spike quickly crosses the
          # threshold and the HPA ramps replicas (base/nhdw-gateway-hpa.yaml).
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          env:
            - { name: KEYCLOAK_ALLOWED_ISSUERS, value: "http://127.0.0.1:8090/realms/moh-staff,http://127.0.0.1:8090/realms/privileged-ops" }
            - { name: KEYCLOAK_PUBLIC_BASE,     value: "http://127.0.0.1:8090" }
            - { name: KEYCLOAK_INTERNAL_BASE,   value: "http://keycloak.nhdw.svc.cluster.local:8080" }
            # Keycloak Admin API — access-request provisioning (§4.8): create the
            # applicant's account + send the set-password email on admin approval.
            - { name: KEYCLOAK_ADMIN_USER,      value: "keycloak_admin" }
            - { name: KEYCLOAK_ADMIN_PASSWORD,  valueFrom: { secretKeyRef: { name: keycloak-secrets, key: KC_BOOTSTRAP_ADMIN_PASSWORD } } }
            - { name: KEYCLOAK_PROVISION_REALM, value: "moh-staff" }
            - { name: DEV_AUTH,                  value: "false" }
            - { name: GATEWAY_PUBLIC_ANON,        value: "true" }
            - { name: GATEWAY_DEMO_IMPERSONATION, value: "true" }
            # Shared secret gating the X-Mock-* impersonation channel — without a
            # matching X-Mock-Secret header the gateway ignores mock identity, so
            # the public ingress can't claim R-SUPER. Held by the demo view-as +
            # the boot seed scripts. Empty ⇒ channel disabled (fail-secure).
            - { name: GATEWAY_IMPERSONATION_SECRET, valueFrom: { secretKeyRef: { name: nhdw-gateway-secrets, key: IMPERSONATION_SECRET, optional: true } } }
            # column masking: hash/tokenize HMAC key — optional: absent ⇒ those
            # mask classes degrade to drop (fail-closed), the gateway still boots
            - { name: MASKING_HMAC_KEY, valueFrom: { secretKeyRef: { name: nhdw-gateway-secrets, key: MASKING_HMAC_KEY, optional: true } } }
            # OPA is the PDP and it ENFORCES: denials become 403 (no advisory flip);
            # if OPA is unreachable, fail CLOSED (deny).
            - { name: OPA_ENFORCE,   value: "true" }
            - { name: OPA_FAIL_OPEN, value: "false" }
            # OPA / Trino / Ollama backends — the gateway already talks to all
            # three (opa.py PDP, trino_client.py federated SQL, chat.py LLM).
            # Declared explicitly here so the wiring is truthful in the manifest and
            # the topology graph derives the gateway→{opa,trino,llm} edges. OPA/Trino
            # are in-cluster; the LLM is now an EXTERNAL component (0_external/llm/)
            # reached via the k3d host route — host.k3d.internal:11434 — exactly like
            # the source replicas + fayda (topology_graph.py synthesizes it as an
            # external node from this host ref, the same way it does fayda-replica).
            - { name: OPA_URL,    value: "http://opa.nhdw.svc.cluster.local:8181" }
            - { name: TRINO_HOST, value: "nhdw-trino.nhdw.svc.cluster.local" }
            - { name: OLLAMA_URL, value: "http://host.k3d.internal:11434" }
            # Agentic assistant model on the EXTERNAL host-GPU ollama. 14b is the
            # durable default (the 3b model can't chain tool calls); gpu-detect.sh
            # only downgrades if the host lacks the 14b weights. Baked here so a
            # gateway redeploy never silently reverts to the code fallback.
            - { name: NHDW_LLM_MODEL, value: "qwen2.5:14b" }
            # Keep the model resident in VRAM across demo-length idle gaps. The
            # per-request keep_alive overrides Ollama's own 30m, so without this the
            # 11GB model unloads after 30m and the next call cold-loads (~15-20s) —
            # which surfaces to the SPA as a misleading "model unreachable".
            - { name: NHDW_LLM_KEEP_ALIVE, value: "24h" }
            - { name: OPS_PG_HOST,    value: "postgres-vault.nhdw.svc.cluster.local" }
            - { name: OPS_PG_PORT,    value: "5432" }
            - { name: OPS_PG_DATABASE, value: "nhdw_ops" }
            - { name: OPS_PG_USER,    value: "ops_gateway" }
            - { name: OPS_PG_PASSWORD, valueFrom: { secretKeyRef: { name: nhdw-gateway-secrets, key: OPS_GATEWAY_PASSWORD } } }
            # MinIO — gateway reads dbt artifacts (manifest.json, run_results.json)
            # from nhdw-artifacts bucket to serve /api/dq/* without bind-mounting.
            - { name: MINIO_ENDPOINT,    value: "http://seaweedfs-s3.nhdw.svc.cluster.local:8333" }   # Phase 6 G2: artifacts/exports/docs served by SeaweedFS
            - { name: BOTO_EXPERIMENTAL__NO_EMPTY_CONTINUE, value: "true" }   # botocore#3755 (zero-byte PUT)
            - { name: MINIO_ACCESS_KEY,  valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER     } } }
            - { name: MINIO_SECRET_KEY,  valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
            # MLflow — gateway /api/ml/* routes proxy registry calls + read
            # from ops_ml.ml_predictions in the same postgres-vault DB.
            - { name: MLFLOW_URL,        value: "http://mlflow.nhdw.svc.cluster.local:5000" }
            # Presigned downloads (ml result CSVs / exports / artifacts) are
            # signed against the BROWSER-reachable MinIO host (ing-minio) —
            # the in-cluster endpoint above is unreachable from the browser.
            - { name: MINIO_PUBLIC_ENDPOINT, value: "https://s3.127.0.0.1.nip.io" }
            # Runner image for the ephemeral train / predict-adhoc Jobs the
            # gateway spawns (/api/ml/{model}/retrain + /predict). A kustomize
            # `images:` remap can't reach dynamically-created Jobs, so the dev
            # overlay patches this env to nhdw/ml-runner:1.0.0 (same pattern as
            # the airflow Deployment — keep the three in sync).
            - { name: ML_RUNNER_IMAGE,   value: "nhdw-registry:5500/nhdw/ml-runner:1.0.0" }
            # Workspace profile catalogue (Small/Medium/Large pod specs) —
            # authoritative file is 6_access-points/jupyterhub/profiles.yaml,
            # mounted via the workspace-profiles configMap. Without it,
            # /api/workspace/profiles is empty and every resource request 404s.
            - { name: WORKSPACE_PROFILES_PATH, value: "/app/config/profiles.yaml" }
            # JupyterHub spawn proxy (/api/workspace/{spawn,status,stop}):
            # in-cluster hub API + the shared service token (jupyterhub-secrets/
            # API_TOKEN — same value the hub registers for the nhdw-gateway
            # service). optional → absent secret = hub honestly 'not configured'.
            - { name: JUPYTERHUB_URL, value: "http://jupyterhub.nhdw.svc.cluster.local:8081" }
            - name: JUPYTERHUB_API_TOKEN
              valueFrom: { secretKeyRef: { name: jupyterhub-secrets, key: API_TOKEN, optional: true } }
            - { name: JUPYTER_PUBLIC_BASE, value: "https://jupyter.127.0.0.1.nip.io" }
            # Disease-surveillance alert evaluator (P3.1): emails fired alerts +
            # provisioning/reset mails. SMTP comes from the smtp-secrets Secret
            # (external Google SMTP relay). HOST/PORT/TLS/FROM default to Gmail in
            # settings.py; USER/PASS are the app-password — absent ⇒ a send fails
            # LOUDLY (Mailpit fallback retired 2026-07-06). The service token
            # authorizes the alert_evaluation DAG's POST /api/alerts/evaluate.
            - { name: SMTP_HOST, valueFrom: { secretKeyRef: { name: smtp-secrets, key: SMTP_HOST, optional: true } } }
            - { name: SMTP_PORT, valueFrom: { secretKeyRef: { name: smtp-secrets, key: SMTP_PORT, optional: true } } }
            - { name: SMTP_TLS,  valueFrom: { secretKeyRef: { name: smtp-secrets, key: SMTP_TLS,  optional: true } } }
            - { name: SMTP_USER, valueFrom: { secretKeyRef: { name: smtp-secrets, key: SMTP_USER, optional: true } } }
            - { name: SMTP_PASS, valueFrom: { secretKeyRef: { name: smtp-secrets, key: SMTP_PASS, optional: true } } }
            - { name: SMTP_FROM, valueFrom: { secretKeyRef: { name: smtp-secrets, key: SMTP_FROM, optional: true } } }
            - { name: ALERT_EVAL_MODEL, value: "ears" }
            - { name: ALERT_EVAL_TOKEN, valueFrom: { secretKeyRef: { name: alert-eval-secrets, key: TOKEN } } }
          volumeMounts:
            - { name: workspace-profiles, mountPath: /app/config, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - { name: workspace-profiles, configMap: { name: workspace-profiles } }
---
apiVersion: v1
kind: Service
metadata:
  name: nhdw-gateway
  namespace: nhdw
  labels: { app: nhdw-gateway, tier: api }
spec:
  type: ClusterIP
  selector: { app: nhdw-gateway }
  ports:
    - { port: 8000, targetPort: http, name: http }
