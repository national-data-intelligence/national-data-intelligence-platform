- role: R-STEW
  dashboards:
  - public
  - internal-bi
  - workshop
  widgets:
    public:
    - pub-hero
    - pub-insights
    - pub-newsroom
    - pub-region
    - pub-supply
    # Steward = data-plane-empty by DESIGN (separation of duties, r-stew.yaml
    # 2026-07-03): OPA denies every mart read for R-STEW, so ANY mart-bound
    # widget renders as an empty husk. Granting them all (~41) produced a
    # dashboard of "No data" panels. Aligned Plane-1 to Plane-2 (same fix as
    # the R-CONS-PRT donor husk, #69): keep ONLY the non-mart widgets that
    # actually render — the assistant, the governance audit trail, and the
    # user settings. The operational data pages (Overview/Disease/Resource/
    # Service) now elide (no granted widgets). The steward's real home is the
    # workshop (catalog/lineage/model governance) below + admin governance.
    # If stewards should instead see AGGREGATE health (docs/user-roles.md §Group E
    # line 445), that is an OPA change (widen r-stew.yaml to aggregate reads),
    # NOT a grant change — flagged for owner.
    internal-bi:
    - bi-assistant
    - ex-audit-trail
    - st-alert-subs
    - st-display
    - st-profile
    - st-security
    workshop:
    - ws-datasets-table
    - ws-models-table
    - ws-help-guides
    - ws-settings-profile
