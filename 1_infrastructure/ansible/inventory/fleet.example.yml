# NHDW inventory — FLEET (example): one k3s server + N agents, local or remote.
#
# Copy to `fleet.yml` and fill in your real hosts, then deploy against it. The SAME
# playbook that handles single-node handles this — only the inventory differs. Hosts
# may be local VMs or remote machines reached over SSH (set ansible_host / ansible_user
# / key). `nhdw_topology: fleet` selects the values-fleet profile (HA control-plane
# option, real storage class, resource requests, pod anti-affinity) at deploy time.
all:
  vars:
    nhdw_topology: fleet
    nhdw_cluster_name: nhdw
    # SSH defaults for remote hosts (override per-host as needed).
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3
  children:
    control_plane:
      # One server for a simple fleet; add 2 more (total 3, odd) for an HA control plane.
      hosts:
        nhdw-server-1:
          ansible_host: 10.0.0.11
    workers:
      hosts:
        nhdw-agent-1:
          ansible_host: 10.0.0.21
        nhdw-agent-2:
          ansible_host: 10.0.0.22
        nhdw-agent-3:
          ansible_host: 10.0.0.23
