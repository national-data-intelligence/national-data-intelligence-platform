# Superset — self-service SQL/BI over the marts (via Trino). Native FAB Keycloak
# OIDC (moh-staff, the analyst audience), same Pattern-A posture as Airflow: the
# tool runs its OWN role-aware OIDC (NOT behind a tool-gate). Governance note in
# superset_config.py — it queries Trino directly (bypasses gateway/OPA, like
# Jupyter), so it's scoped to the trusted analyst roles only.
#
# Single-process demo: gunicorn only, no celery/redis. Metadata store =
# nhdw_superset in postgres-vault (31_superset_db.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: {{ .Values.namespace }}
  labels: { app: superset, tier: bi }
spec:
  replicas: 1
  strategy: { type: Recreate }   # single writer to the metadata DB
  selector: { matchLabels: { app: superset } }
  template:
    metadata: { labels: { app: superset, tier: bi } }
    spec:
      # ── init: run migrations, seed FAB roles, upsert the Trino connection ──
      initContainers:
        - name: superset-init
          image: {{ include "nhdw.image" (dict "name" "superset" "ctx" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              superset db upgrade
              superset init
              python /app/pythonpath/create_trino_db.py
          env:
            - { name: SUPERSET_CONFIG_PATH, value: "/app/pythonpath/superset_config.py" }
            - { name: SUPERSET_DB_HOST,     value: "postgres-vault.{{ .Values.namespace }}.svc.cluster.local" }
            - name: SUPERSET_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: superset-secrets, key: DB_PASSWORD } }
            - name: SUPERSET_SECRET_KEY
              valueFrom: { secretKeyRef: { name: superset-secrets, key: SECRET_KEY } }
            # ── native Keycloak OIDC (moh-staff), split-URL (browser=public,
            #    pod=internal) exactly like Airflow's webserver_config.py ──
            - { name: SUPERSET_OIDC_CLIENT_ID,       value: "superset" }
            - name: SUPERSET_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: superset-secrets, key: OIDC_CLIENT_SECRET, optional: true } }
            - { name: SUPERSET_OIDC_ISSUER_PUBLIC,   value: "https://keycloak.{{ .Values.hostBase }}/realms/moh-staff" }
            - { name: SUPERSET_OIDC_ISSUER_INTERNAL, value: "http://keycloak.{{ .Values.namespace }}.svc.cluster.local:8080/realms/moh-staff" }
      containers:
        - name: superset
          image: {{ include "nhdw.image" (dict "name" "superset" "ctx" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              exec gunicorn --bind 0.0.0.0:8088 --workers 2 --worker-class gthread \
                --threads 20 --timeout 120 --limit-request-line 0 \
                --limit-request-field_size 0 "superset.app:create_app()"
          ports: [ { containerPort: 8088, name: http } ]
          env:
            - { name: SUPERSET_CONFIG_PATH, value: "/app/pythonpath/superset_config.py" }
            - { name: SUPERSET_DB_HOST,     value: "postgres-vault.{{ .Values.namespace }}.svc.cluster.local" }
            - name: SUPERSET_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: superset-secrets, key: DB_PASSWORD } }
            - name: SUPERSET_SECRET_KEY
              valueFrom: { secretKeyRef: { name: superset-secrets, key: SECRET_KEY } }
            # ── native Keycloak OIDC (moh-staff), split-URL (browser=public,
            #    pod=internal) exactly like Airflow's webserver_config.py ──
            - { name: SUPERSET_OIDC_CLIENT_ID,       value: "superset" }
            - name: SUPERSET_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: superset-secrets, key: OIDC_CLIENT_SECRET, optional: true } }
            - { name: SUPERSET_OIDC_ISSUER_PUBLIC,   value: "https://keycloak.{{ .Values.hostBase }}/realms/moh-staff" }
            - { name: SUPERSET_OIDC_ISSUER_INTERNAL, value: "http://keycloak.{{ .Values.namespace }}.svc.cluster.local:8080/realms/moh-staff" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { cpu: "1", memory: "1536Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: {{ .Values.namespace }}
  labels: { app: superset, tier: bi }
spec:
  type: ClusterIP
  selector: { app: superset }
  ports: [ { port: 8088, targetPort: http, name: http } ]
