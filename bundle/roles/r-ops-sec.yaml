# R-OPS-SEC — Security / Compliance Officer
#
# Authoritative spec: docs/user-roles.md §3 Group F → R-OPS-SEC.
role:
  id: R-OPS-SEC
  name: "Security / Compliance Officer"
  group: Operator
  identity_provider: Privileged-Keycloak
  mfa_required: true
  mfa_factor: WebAuthn   # hardware mandatory
  phase_activated: 1
  audit_class: privileged
  notes: |
    Security team, compliance officer, internal auditor.
    Reads audit trail (append-only), reviews RBAC config, approves break-
    glass requests, builds SIEM alert rules.

    CANNOT read data content. CANNOT modify or delete audit records.
    Separation of duties enforced architecturally — audit store is
    write-once / append-only.

    All subjects below grant METADATA ONLY (the audit trail about subject
    access — not the subject data itself).
  permissions:
    - subject: PT
      data_class: []
      members: all
      granularity: metadata
      sensitivity: []
      verbs: [read, annotate, approve]   # approve = break-glass approval
      purpose_of_use: [audit]

    - subject: HP
      data_class: []
      members: all
      granularity: metadata
      sensitivity: []
      verbs: [read, annotate, approve]
      purpose_of_use: [audit]

    - subject: FAC
      data_class: []
      members: all
      granularity: metadata
      sensitivity: []
      verbs: [read, annotate, approve]
      purpose_of_use: [audit]

    - subject: PRD
      data_class: []
      members: all
      granularity: metadata
      sensitivity: []
      verbs: [read, annotate, approve]
      purpose_of_use: [audit]

    - subject: PRG
      data_class: []
      members: all
      granularity: metadata
      sensitivity: []
      verbs: [read, annotate, approve]
      purpose_of_use: [audit]
