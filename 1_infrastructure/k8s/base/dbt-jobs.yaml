# Pipeline Jobs run on-demand by `bootstrap.sh --rebuild-from-source`.
# Sequence: minio-init → ch-raw-views → processed-zone → bridge → dbt-vault → dbt-marts.
# (dbt-staging produces CH views; bridge then mirrors them to PG landing.)
#
# Each Job is independent and observable in `kubectl get jobs`.

# ─── minio-init · create buckets + service accounts ──────────────────
apiVersion: batch/v1
kind: Job
metadata: { name: minio-init, namespace: nhdw, labels: { app: minio-init, tier: pipeline } }
spec:
  backoffLimit: 1
  template:
    metadata: { labels: { app: minio-init, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-08T15-39-49Z
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              set -eu
              mc alias set local "http://minio-datalake.nhdw.svc.cluster.local:9000" \
                  "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
              for b in nhdw-raw nhdw-processed nhdw-archive nhdw-exports nhdw-artifacts nhdw-static; do
                  mc mb --ignore-existing "local/$b" >/dev/null
                  echo "  ✓ bucket $b ready"
              done
              mc version enable local/nhdw-raw     >/dev/null || true
              mc version enable local/nhdw-archive >/dev/null || true

              # nhdw-static — the PUBLIC open-data bucket: anonymous read-only so
              # the public dashboard can download the pre-generated dataset files
              # + catalogue manifest directly (published open data, no auth).
              mc anonymous set download local/nhdw-static >/dev/null || true
              echo "  ✓ nhdw-static anonymous-read enabled"

              # MLflow service account — full read/write under nhdw-artifacts
              # so model versions can be uploaded under mlflow/ prefix.
              if ! mc admin user info local "$MLFLOW_S3_USER" >/dev/null 2>&1; then
                  mc admin user add    local "$MLFLOW_S3_USER" "$MLFLOW_S3_PASS"
                  mc admin policy attach local readwrite --user "$MLFLOW_S3_USER" >/dev/null
                  echo "  ✓ mlflow user provisioned"
              fi

              # Project-sync service account (JupyterLab labs) — least-priv:
              # list/get/put ONLY under nhdw-artifacts/projects/*. These creds
              # ride inside user notebook pods, so they must never be root.
              # No s3:DeleteObject: the lab push loop is non-destructive.
              if [ -n "${PROJECT_SYNC_USER:-}" ]; then
                  printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::nhdw-artifacts"],"Condition":{"StringLike":{"s3:prefix":["projects/*"]}}},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject"],"Resource":["arn:aws:s3:::nhdw-artifacts/projects/*"]}]}' \
                      > /tmp/project-sync-policy.json
                  mc admin policy create local nhdw-project-sync /tmp/project-sync-policy.json >/dev/null 2>&1 || true
                  mc admin user add local "$PROJECT_SYNC_USER" "$PROJECT_SYNC_PASS" >/dev/null
                  mc admin policy attach local nhdw-project-sync --user "$PROJECT_SYNC_USER" >/dev/null 2>&1 || true
                  echo "  ✓ project-sync user provisioned (projects/* only)"
              fi
              echo "minio-init complete"
          env:
            - { name: MINIO_ROOT_USER,     valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER     } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
            - { name: MLFLOW_S3_USER,      valueFrom: { secretKeyRef: { name: mlflow-secrets, key: S3_ACCESS_KEY } } }
            - { name: MLFLOW_S3_PASS,      valueFrom: { secretKeyRef: { name: mlflow-secrets, key: S3_SECRET_KEY } } }
            # optional: an old secrets.yaml without the keys just skips the user.
            - { name: PROJECT_SYNC_USER,   valueFrom: { secretKeyRef: { name: minio-secrets, key: PROJECT_SYNC_ACCESS_KEY, optional: true } } }
            - { name: PROJECT_SYNC_PASS,   valueFrom: { secretKeyRef: { name: minio-secrets, key: PROJECT_SYNC_SECRET_KEY, optional: true } } }


# ─── ch-raw-views · the RESILIENT raw-view surface, fully in-cluster ─
# apply_raw_views.py (staging image): ensures the CH databases, drops stale
# views, probes the lake THROUGH ClickHouse (server-side nhdw_minio named
# collection — no MinIO creds anywhere here), then applies
# raw_views/raw_views.sql with empty-typed views for absent tables and
# NULL-patches for ingestor-dropped columns. No configMap, no cred
# injection, no host-side prep — the Job owns its whole surface.
---
apiVersion: batch/v1
kind: Job
metadata: { name: ch-raw-views, namespace: nhdw, labels: { app: ch-raw-views, tier: pipeline } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata: { labels: { app: ch-raw-views, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply-raw-views
          image: nhdw-registry:5500/nhdw/staging-dbt:1.0.0
          imagePullPolicy: Always
          command: ["python", "/dbt/scripts/apply_raw_views.py"]
          env:
            - { name: CH_HOST, value: "clickhouse.nhdw.svc.cluster.local" }
            - { name: CH_PORT, value: "8123" }
            - { name: CH_USER, value: "nhdw" }
            - name: CH_PASSWORD
              valueFrom: { secretKeyRef: { name: clickhouse-secrets, key: PASSWORD } }

# ─── processed-zone · PII-stripped copy of the landing zone ──────────
# build_processed_zone.py (staging image): enumerates populated nhdw-raw
# tables through ClickHouse, drops the columns named in pii_policy.yaml
# (+ _dlt bookkeeping) and rewrites each table server-side into
# nhdw-processed — the ML raw-access surface. Unclassified tables are
# loudly SKIPPED (fail-safe). The initContainer wipes the bucket first:
# the zone is regenerable by contract, so retired tables never linger.
---
apiVersion: batch/v1
kind: Job
metadata: { name: processed-zone, namespace: nhdw, labels: { app: processed-zone, tier: pipeline } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata: { labels: { app: processed-zone, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wipe-zone
          image: minio/mc:RELEASE.2025-04-08T15-39-49Z
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              set -eu
              mc alias set local "http://minio-datalake.nhdw.svc.cluster.local:9000" \
                  "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
              mc rm -r --force local/nhdw-processed >/dev/null 2>&1 || true
              mc mb --ignore-existing local/nhdw-processed >/dev/null
              echo "nhdw-processed wiped (regenerable zone — clean slate)"
          env:
            - { name: MINIO_ROOT_USER,     valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER     } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
      containers:
        - name: build-processed-zone
          image: nhdw-registry:5500/nhdw/staging-dbt:1.0.0
          imagePullPolicy: Always
          command: ["python", "/dbt/scripts/build_processed_zone.py"]
          env:
            - { name: CH_HOST, value: "clickhouse.nhdw.svc.cluster.local" }
            - { name: CH_PORT, value: "8123" }
            - { name: CH_USER, value: "nhdw" }
            - name: CH_PASSWORD
              valueFrom: { secretKeyRef: { name: clickhouse-secrets, key: PASSWORD } }

# ─── bridge · CH staging  →  PG nhdw_landing ─────────────────────────
---
apiVersion: batch/v1
kind: Job
metadata: { name: bridge-sync, namespace: nhdw, labels: { app: bridge-sync, tier: pipeline } }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata: { labels: { app: bridge-sync, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bridge
          image: nhdw-registry:5500/nhdw/vault-bridge:1.0.0
          imagePullPolicy: Always
          env:
            - { name: CH_HOST,     value: "clickhouse.nhdw.svc.cluster.local" }
            - { name: CH_PORT,     value: "9000" }
            - { name: CH_USER,     value: "nhdw" }
            - { name: CH_PASSWORD, valueFrom: { secretKeyRef: { name: clickhouse-secrets,      key: PASSWORD } } }
            - { name: CH_DATABASE, value: "nhdw_staging" }
            - { name: PG_HOST,     value: "postgres-vault.nhdw.svc.cluster.local" }
            - { name: PG_PORT,     value: "5432" }
            - { name: PG_USER,     value: "landing_writer" }
            - { name: PG_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-vault-secrets, key: LANDING_WRITER_PASSWORD } } }
            - { name: PG_DATABASE, value: "nhdw_vault" }
            - { name: PG_SCHEMA,   value: "nhdw_landing" }

# ─── dbt-staging · ClickHouse views ──────────────────────────────────
# The staging image's entrypoint.py wraps dbt: after `dbt build` it uploads
# target/{manifest,run_results,catalog}.json to MinIO under
# nhdw-artifacts/dbt/staging/ and runs `dbt docs generate` into the shared
# dbt-docs-content PVC (DBT_DOCS_OUT), so the dbt-docs surface serves staging
# lineage. Same wrapper + prefixes + PVC as dbt-marts.
---
apiVersion: batch/v1
kind: Job
metadata: { name: dbt-staging, namespace: nhdw, labels: { app: dbt-staging, tier: pipeline } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata: { labels: { app: dbt-staging, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: dbt
          image: nhdw-registry:5500/nhdw/staging-dbt:1.0.0
          imagePullPolicy: Always
          # ENTRYPOINT is entrypoint.py; these args forward to `dbt build`, then
          # the wrapper uploads artifacts + generates docs (see section note).
          args: [ "build", "--target", "dev" ]
          env:
            - { name: CH_HOST,     value: "clickhouse.nhdw.svc.cluster.local" }
            - { name: CH_PORT,     value: "8123" }
            - { name: CH_USER,     value: "nhdw" }
            - { name: CH_PASSWORD, valueFrom: { secretKeyRef: { name: clickhouse-secrets, key: PASSWORD } } }
            - { name: CH_SCHEMA,   value: "nhdw_staging" }
            - { name: DBT_PROJECT,            value: "staging" }
            - { name: MINIO_ENDPOINT,         value: "http://minio-datalake.nhdw.svc.cluster.local:9000" }
            - { name: MINIO_ACCESS_KEY,       valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER     } } }
            - { name: MINIO_SECRET_KEY,       valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
            - { name: MINIO_ARTIFACTS_BUCKET, value: "nhdw-artifacts" }
            # dbt docs generate → the shared dbt-docs-content PVC (Tool-SSO A2).
            - { name: DBT_DOCS_OUT,           value: "/dbt-docs-out" }
          volumeMounts:
            - { name: dbt-docs-out, mountPath: /dbt-docs-out }
      volumes:
        - name: dbt-docs-out
          persistentVolumeClaim: { claimName: dbt-docs-content }

# ─── dbt-vault · postgres incrementals (full-refresh on cold boot) ───
---
apiVersion: batch/v1
kind: Job
metadata: { name: dbt-vault, namespace: nhdw, labels: { app: dbt-vault, tier: pipeline } }
spec:
  backoffLimit: 1
  template:
    metadata: { labels: { app: dbt-vault, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: dbt
          image: nhdw-registry:5500/nhdw/vault-dbt:1.0.0
          imagePullPolicy: Always
          # HISTORY-PRESERVING conditional refresh (DV2 upgrade, 2026-07-03):
          # the vault is insert-only (append strategy), so a COLD schema needs
          # one clean --full-refresh pass to lay the hub/link/sat boundaries,
          # but every WARM re-run must be plain incremental — else --full-refresh
          # would rebuild from the current source snapshot and DESTROY the
          # accumulated satellite history (turning the vault back into SCD-1).
          # The Job decides from live schema state; no orchestration/manifest env.
          command: [ "sh", "-c" ]
          args:
            - |
              N=$(python3 -c "import os,psycopg2;c=psycopg2.connect(host=os.environ['PG_HOST'],port=os.environ['PG_PORT'],dbname=os.environ['PG_DATABASE'],user=os.environ['PG_USER'],password=os.environ['PG_PASSWORD']);k=c.cursor();k.execute(\"select count(*) from information_schema.tables where table_schema='nhdw_vault_raw'\");print(k.fetchone()[0])")
              if [ "$N" = "0" ]; then echo "[refresh] cold vault (0 raw tables) -> --full-refresh"; FLAG=--full-refresh; else echo "[refresh] warm vault ($N raw tables) -> incremental (history preserved)"; FLAG=; fi
              # ANALYZE first: the bridge DROP+CREATEs the landing tables every
              # sync, so they arrive stats-less — the planner then picks
              # nested-loop plans that turn the spine builds into hour-long
              # queries (observed 2026-07-10 at ~650k dataValues). Cheap (<1min).
              python3 -c "import os,psycopg2;c=psycopg2.connect(host=os.environ['PG_HOST'],port=os.environ['PG_PORT'],dbname=os.environ['PG_DATABASE'],user=os.environ['PG_USER'],password=os.environ['PG_PASSWORD']);c.autocommit=True;c.cursor().execute('ANALYZE');print('[analyze] landing/staging statistics refreshed')"
              exec python3 /dbt/entrypoint.py build $FLAG --target dev
          env:
            - { name: PG_HOST,     value: "postgres-vault.nhdw.svc.cluster.local" }
            - { name: PG_PORT,     value: "5432" }
            - { name: PG_USER,     value: "vault_writer" }
            - { name: PG_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-vault-secrets, key: VAULT_WRITER_PASSWORD } } }
            - { name: PG_DATABASE, value: "nhdw_vault" }
            # entrypoint.py: upload target/ artifacts to nhdw-artifacts/dbt/vault/
            # + `dbt docs generate` → shared dbt-docs-content PVC (same as marts).
            - { name: DBT_PROJECT,            value: "vault" }
            - { name: MINIO_ENDPOINT,         value: "http://minio-datalake.nhdw.svc.cluster.local:9000" }
            - { name: MINIO_ACCESS_KEY,       valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER     } } }
            - { name: MINIO_SECRET_KEY,       valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
            - { name: MINIO_ARTIFACTS_BUCKET, value: "nhdw-artifacts" }
            - { name: DBT_DOCS_OUT,           value: "/dbt-docs-out" }
          volumeMounts:
            - { name: dbt-docs-out, mountPath: /dbt-docs-out }
      volumes:
        - name: dbt-docs-out
          persistentVolumeClaim: { claimName: dbt-docs-content }

# ─── dbt-marts · bi_* schemas ────────────────────────────────────────
# Also uploads target/{manifest,run_results,catalog}.json to MinIO under
# nhdw-artifacts/dbt/marts/ on each run — entrypoint.py wraps dbt to do
# this so the gateway's /api/dq/* endpoints can serve live lineage data.
---
apiVersion: batch/v1
kind: Job
metadata: { name: dbt-marts, namespace: nhdw, labels: { app: dbt-marts, tier: pipeline } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata: { labels: { app: dbt-marts, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: dbt
          image: nhdw-registry:5500/nhdw/marts-dbt:1.0.0
          imagePullPolicy: Always
          # Same conditional refresh as dbt-vault. Marts are table-materialized
          # (they rebuild from the current vault, reading v_*_current for the
          # latest sat version), so this is mostly cosmetic here — but it keeps
          # the two stages symmetric and safe if a mart ever goes incremental.
          # entrypoint.py (MinIO target/ upload) is preserved via exec.
          command: [ "sh", "-c" ]
          args:
            - |
              N=$(python3 -c "import os,psycopg2;c=psycopg2.connect(host=os.environ['PG_HOST'],port=os.environ['PG_PORT'],dbname=os.environ['PG_DATABASE'],user=os.environ['PG_USER'],password=os.environ['PG_PASSWORD']);k=c.cursor();k.execute(\"select count(*) from information_schema.tables where table_schema='bi_hmis'\");print(k.fetchone()[0])")
              if [ "$N" = "0" ]; then echo "[refresh] cold marts -> --full-refresh"; FLAG=--full-refresh; else echo "[refresh] warm marts -> incremental"; FLAG=; fi
              # ANALYZE first: a vault full-refresh recreates every hub/link/sat
              # WITHOUT statistics — the planner then nested-loops the BV-spine
              # joins and mart_hmis_indicator_coverage runs for hours instead of
              # minutes (observed 2026-07-10 at ~650k dataValues). Cheap (<1min).
              python3 -c "import os,psycopg2;c=psycopg2.connect(host=os.environ['PG_HOST'],port=os.environ['PG_PORT'],dbname=os.environ['PG_DATABASE'],user=os.environ['PG_USER'],password=os.environ['PG_PASSWORD']);c.autocommit=True;c.cursor().execute('ANALYZE');print('[analyze] vault statistics refreshed')"
              exec python3 /dbt/entrypoint.py build $FLAG --target dev
          env:
            - { name: PG_HOST,     value: "postgres-vault.nhdw.svc.cluster.local" }
            - { name: PG_PORT,     value: "5432" }
            - { name: PG_USER,     value: "vault_writer" }
            - { name: PG_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-vault-secrets, key: VAULT_WRITER_PASSWORD } } }
            - { name: PG_DATABASE, value: "nhdw_vault" }
            - { name: DBT_PROJECT,            value: "marts" }
            - { name: MINIO_ENDPOINT,         value: "http://minio-datalake.nhdw.svc.cluster.local:9000" }
            - { name: MINIO_ACCESS_KEY,       valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER     } } }
            - { name: MINIO_SECRET_KEY,       valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
            - { name: MINIO_ARTIFACTS_BUCKET, value: "nhdw-artifacts" }
            # dbt docs generate → the shared dbt-docs-content PVC (Tool-SSO A2).
            - { name: DBT_DOCS_OUT,           value: "/dbt-docs-out" }
          volumeMounts:
            - { name: dbt-docs-out, mountPath: /dbt-docs-out }
      volumes:
        - name: dbt-docs-out
          persistentVolumeClaim: { claimName: dbt-docs-content }

# ─── publish-datasets · Open-Data catalogue → nhdw-static ────────────────
# Cuts each bi_public.* dataset into a CSV + catalogue.json manifest in the
# anonymous nhdw-static bucket (publish_public_datasets.py, baked in the marts
# image). Runs after dbt-marts so the marts exist. Re-derivable (never packed).
---
apiVersion: batch/v1
kind: Job
metadata: { name: publish-datasets, namespace: nhdw, labels: { app: publish-datasets, tier: pipeline } }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata: { labels: { app: publish-datasets, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: publish
          image: nhdw-registry:5500/nhdw/marts-dbt:1.0.0
          imagePullPolicy: IfNotPresent
          command: [ "python3", "/dbt/publish_public_datasets.py" ]
          env:
            - { name: PG_HOST,     value: "postgres-vault.nhdw.svc.cluster.local" }
            - { name: PG_PORT,     value: "5432" }
            - { name: PG_USER,     value: "vault_writer" }
            - { name: PG_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-vault-secrets, key: VAULT_WRITER_PASSWORD } } }
            - { name: PG_DATABASE, value: "nhdw_vault" }
            - { name: MINIO_ENDPOINT,        value: "http://minio-datalake.nhdw.svc.cluster.local:9000" }
            - { name: MINIO_ACCESS_KEY,      valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER     } } }
            - { name: MINIO_SECRET_KEY,      valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
            - { name: MINIO_PUBLIC_ENDPOINT, value: "https://minio.127.0.0.1.nip.io" }
