# MinIO S3 API — needed ONLY for gateway-presigned browser downloads
# (ml result CSVs, exports, artifact downloads). The gateway signs against
# MINIO_PUBLIC_ENDPOINT (this host); data-plane access stays gateway-mediated.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ing-minio, namespace: nhdw }
spec:
  ingressClassName: traefik
  tls: [ { hosts: [ minio.127.0.0.1.nip.io ], secretName: nhdw-wildcard-tls } ]
  rules:
    - host: minio.127.0.0.1.nip.io
      http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: seaweedfs-s3, port: { number: 8333 } } } } ] }
---
# MinIO web CONSOLE (:9001) — the browsable object-browser the operator opens
# from Admin → Quality & lineage to inspect the raw data lake. The minio.*
# host above is the S3 API (:8333) and is NOT browsable — pointing a "browse"
# link there fails ("site can't be reached"). This routes a distinct host to
# the console port the Deployment already serves (--console-address :9001).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ing-minio-console, namespace: nhdw }
spec:
  ingressClassName: traefik
  tls: [ { hosts: [ minio-console.127.0.0.1.nip.io ], secretName: nhdw-wildcard-tls } ]
  rules:
    - host: minio-console.127.0.0.1.nip.io
      http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: minio-datalake, port: { number: 9001 } } } } ] }
---
# Observability UIs (#81) — operator-facing. Prometheus expression browser +
# Alertmanager, now fronted by their tool-gates (nhdw/tool-gate): per-role OIDC
# (R-OPS-* / R-SUPER, either staff realm) + shared-session auto-login. Previously
# these were UNAUTHENTICATED (plain ingress) — the gate closes that hole.
# Loki has no UI (API only) — it is reached in-cluster via the gateway's LOKI_URL.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ing-prometheus, namespace: nhdw }
spec:
  ingressClassName: traefik
  tls: [ { hosts: [ prometheus.127.0.0.1.nip.io ], secretName: nhdw-wildcard-tls } ]
  rules:
    - host: prometheus.127.0.0.1.nip.io
      http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: prometheus-gate, port: { number: 80 } } } } ] }
