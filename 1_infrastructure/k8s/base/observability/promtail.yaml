# Promtail (#81) — the log shipper. A DaemonSet that tails EVERY pod's
# stdout/stderr on the node (k3d writes them under /var/log/pods) and pushes them
# to Loki with labels the admin topology filters on:
#   {namespace, app, pod, container, node_name, stream}
# Discovery is kubernetes_sd (role: pod) scoped to the nhdw namespace, so only
# NHDW workloads are shipped. Positions are kept on the node's /var/log so a
# restart resumes rather than re-ships.
#
# WIRING CONTRACTS:
#   * Pushes to  http://loki.nhdw.svc.cluster.local:3100/loki/api/v1/push
#   * Exposes its own /metrics on :9080 (scraped as job=promtail).
#   * Per-node log tail (topology): LogQL  {namespace="nhdw", app="<node-id>"}
#     — <node-id> is the Deployment/StatefulSet name, which equals the pod `app`
#     label for every NHDW workload.
#
# NOTE: this DaemonSet is NOT covered by the overlay's Deployment/StatefulSet
# imagePullPolicy patch, so IfNotPresent is set explicitly here (offline-first).
apiVersion: v1
kind: ServiceAccount
metadata: { name: promtail, namespace: nhdw, labels: { app: promtail, tier: observability } }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: nhdw-promtail, labels: { app: promtail, tier: observability } }
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: nhdw-promtail, labels: { app: promtail, tier: observability } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nhdw-promtail }
subjects:
  - { kind: ServiceAccount, name: promtail, namespace: nhdw }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: promtail-config, namespace: nhdw, labels: { app: promtail, tier: observability } }
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: warn

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.nhdw.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: nhdw-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [nhdw]
        relabel_configs:
          # Intentional, low-cardinality label set only (no labelmap — that would
          # pull churning labels like pod-template-hash into Loki streams).
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node_name
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # default the `app` label from the pod's app label (topology node id)
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          # __path__ → the on-node log file for this pod/container:
          #   /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
          # separator:/ joins uid+container into one value; the default regex
          # (.*) captures the whole thing as $1, so the single-$1 replacement is
          # the canonical form (a $1/$2 split would leave $2 empty and break it).
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
        pipeline_stages:
          # k3d/containerd writes CRI-format log lines; parse ts + stream.
          - cri: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: promtail, namespace: nhdw, labels: { app: promtail, tier: observability } }
spec:
  selector: { matchLabels: { app: promtail } }
  updateStrategy: { type: RollingUpdate }
  template:
    metadata: { labels: { app: promtail, tier: observability } }
    spec:
      serviceAccountName: promtail
      securityContext: { runAsUser: 0 }        # must read root-owned /var/log/pods
      containers:
        - name: promtail
          image: grafana/promtail:2.9.10
          imagePullPolicy: IfNotPresent
          args: [ "-config.file=/etc/promtail/promtail.yml" ]
          env:
            - name: HOSTNAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports: [ { name: http-metrics, containerPort: 9080 } ]
          readinessProbe: { httpGet: { path: /ready, port: http-metrics }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: "20m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          volumeMounts:
            - { name: config,    mountPath: /etc/promtail }
            - { name: positions, mountPath: /run/promtail }
            - { name: varlog,    mountPath: /var/log, readOnly: true }
      volumes:
        - { name: config,    configMap: { name: promtail-config } }
        - { name: positions, hostPath: { path: /var/log/promtail-positions, type: DirectoryOrCreate } }
        - { name: varlog,    hostPath: { path: /var/log } }
---
apiVersion: v1
kind: Service
metadata: { name: promtail, namespace: nhdw, labels: { app: promtail, tier: observability } }
spec:
  selector: { app: promtail }
  ports: [ { name: http-metrics, port: 9080, targetPort: http-metrics } ]
