---
# Deploy the app tier with Helm (P3) + the deploy-role dependencies (namespace, the 7 external-file
# configMaps, secrets) + the kube-system metrics-server; then wait for the deployed infra to be
# ready and run the known cold-boot init reconciles. Mirrors bundle/scripts/bootstrap.sh steps 4-5.
# Seeding + the pipeline live in the seed role.

# The namespace is a deploy-role dependency (like the configMaps/secrets), NOT a chart resource —
# so Helm never contends with `kubectl` over its ownership. Create it before anything lands in it.
- name: Ensure the target namespace exists
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      kubectl create namespace {{ nhdw_namespace }} --dry-run=client -o yaml | kubectl apply -f -
    executable: /bin/bash
  register: deploy_ns
  changed_when: "'created' in deploy_ns.stdout"

- name: Render committed secrets.yaml (random per-deploy; never clobbers an existing file)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/gen-secrets.sh"
  args:
    chdir: "{{ nhdw_repo_root }}"
  changed_when: true

- name: Generate the locally-trusted wildcard TLS (nhdw-wildcard-tls); dev falls back to self-signed
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/gen-tls.sh"
  args:
    chdir: "{{ nhdw_repo_root }}"
  register: deploy_tls
  failed_when: false
  changed_when: true

# The chart renders every workload/Service/RBAC/Ingress + the INLINE configMaps. It delegates the
# 7 external-file configMaps + the Secrets to this role (see the chart README). Generate them from
# the CANONICAL overlay (no file-list duplication) and apply only those — the selector drops the
# chart-owned inline configMaps so Helm and kubectl never fight over the same object.
- name: Apply the deploy-role configMaps + secrets (external-file generators the chart delegates)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      kustomize build --load-restrictor=LoadRestrictionsNone {{ nhdw_overlay_dir }}
      | python3 {{ role_path }}/files/select-external-config.py '{{ nhdw_chart_owned_configmaps | join(",") }}'
      | kubectl apply -f -
    executable: /bin/bash
  register: deploy_config_apply
  changed_when: "'created' in deploy_config_apply.stdout or 'configured' in deploy_config_apply.stdout"

# NO --wait: the gateway (and any workload whose readiness depends on the seed) crash-loops until
# the seed role runs, so waiting for the whole release here would always time out. The explicit
# infra waits below gate the seed step instead; the seed role restarts the gateway once seeded.
- name: Deploy / upgrade the NHDW Helm chart for topology {{ nhdw_topology }}
  ansible.builtin.command: >-
    {{ nhdw_helm }} upgrade --install nhdw {{ nhdw_chart_dir }}
    -n {{ nhdw_namespace }}
    -f {{ nhdw_values_file }}
  register: deploy_helm_apply
  changed_when: "'has been' in deploy_helm_apply.stdout"

- name: Point the gateway at the host's assistant model (GPU=14b / CPU=3b); best-effort
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/gpu-detect.sh {{ nhdw_namespace }}"
  args:
    chdir: "{{ nhdw_repo_root }}"
  failed_when: false
  changed_when: false

# metrics-server lands in kube-system (the overlay/chart pin namespace=nhdw and would rewrite it
# out) — it backs `kubectl top` + the gateway HPA (scalability demo). P5 note: on k3s this is
# cluster infra like the CNI, so it may move to the provision role.
- name: Apply metrics-server (kube-system; the chart does not own it)
  ansible.builtin.command: "kubectl apply -f {{ nhdw_repo_root }}/1_infrastructure/k8s/base/metrics-server.yaml"
  register: deploy_metrics
  changed_when: "'created' in deploy_metrics.stdout or 'configured' in deploy_metrics.stdout"

# ── step 5: wait for the deployed infra to be ready + run the cold-boot init reconciles ─────────
- name: Wait for postgres-vault to be Ready (must be up before seeding)
  ansible.builtin.command: "kubectl -n {{ nhdw_namespace }} rollout status statefulset/postgres-vault --timeout=300s"
  changed_when: false

- name: Wait for the keycloak-seed Job to complete
  ansible.builtin.command: "kubectl -n {{ nhdw_namespace }} wait --for=condition=complete job/keycloak-seed --timeout=420s"
  changed_when: false

# MinIO does a ONE-SHOT OpenID init at startup; on a cold boot it can start before Keycloak is
# reachable, the init fails, and the console SSO button is silently absent. Now that keycloak-seed
# has completed, restart MinIO IFF its OIDC init failed.
- name: Restart minio-datalake if its one-shot OIDC init failed (cold-boot console SSO guard)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if kubectl -n {{ nhdw_namespace }} logs deploy/minio-datalake --tail=400 2>/dev/null | grep -q 'Unable to initialize OpenID'; then
        kubectl -n {{ nhdw_namespace }} rollout restart deploy/minio-datalake
        kubectl -n {{ nhdw_namespace }} rollout status deploy/minio-datalake --timeout=120s
        echo restarted
      else
        echo ok
      fi
    executable: /bin/bash
  register: deploy_minio_oidc
  changed_when: "'restarted' in deploy_minio_oidc.stdout"
  failed_when: false

# 31_superset_db.sh provisions the Superset metadata role during postgres-vault's ONE-TIME initdb,
# which races the superset-secrets Secret — so on a cold boot the role can be silently missing.
# Re-run the idempotent provisioning now that postgres + the secret both exist; bounce Superset.
- name: Reconcile the Superset metadata DB/role (initdb secret-race guard; non-blocking)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      SS_PW=$(kubectl -n {{ nhdw_namespace }} get secret superset-secrets -o jsonpath='{.data.DB_PASSWORD}' 2>/dev/null | base64 -d)
      PGU=$(kubectl -n {{ nhdw_namespace }} exec postgres-vault-0 -- printenv POSTGRES_USER 2>/dev/null)
      if [ -n "$SS_PW" ] && [ -n "$PGU" ]; then
        cat {{ nhdw_repo_root }}/3_storage/postgres/init/31_superset_db.sh \
          | kubectl -n {{ nhdw_namespace }} exec -i postgres-vault-0 -- \
              env SUPERSET_DB_PASSWORD="$SS_PW" POSTGRES_USER="$PGU" bash -s
        kubectl -n {{ nhdw_namespace }} rollout restart deploy/superset || true
        echo reconciled
      else
        echo skipped
      fi
    executable: /bin/bash
  register: deploy_superset_db
  changed_when: "'reconciled' in deploy_superset_db.stdout"
  failed_when: false

- name: Restore packed runtime state if present (factory bundles have none — no-op)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/restore-state.sh"
  args:
    chdir: "{{ nhdw_repo_root }}"
  changed_when: true
  failed_when: false
