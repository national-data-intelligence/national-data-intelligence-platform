  - "Oromia stockouts in the next 14 days"
  - "Take me to disease surveillance for Oromia"

R-PD-HIV:
  - "Latest HIV cascade snapshot"
  - "Which regions are below 95-95-95?"
  - "TB co-infection rate by region"

R-CONS-ANA:
  - "Compare HIV vs TB cascade attainment"
  - "Pull weekly cases for cholera, last 12wk"
  - "Run a query: facility coverage by woreda"
  - "Draft a SQL for stockout forecast next 30 days"

R-STEW:
