apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "30s"

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # FHIR AuditEvent rows are pushed as JSON strings, not LogQL-parsed
      # labels. Detected fields surface the JSON properties so dashboards
      # can group by action/role without re-stringifying.
      maxLines: 1000
