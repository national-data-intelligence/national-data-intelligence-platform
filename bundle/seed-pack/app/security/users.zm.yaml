# Demo users + their initial role assignments — ZAMBIA (zm-v1).
#
# The Ethiopian cast, mirrored one person at a time, so both profiles exercise
# exactly the same paths: the same realms, the same roles, the same shape of
# scope. Only the identities and the geography change. `kc_sub` UUIDs are
# deliberately the SAME as users.yaml — they are demo identities, and keeping
# them stable means the pixel-diff harness and the DEV_AUTH defaults in each
# dashboard keep working across a profile swap.
#
# Geography scopes use eLMIS province codes from the zm-v1 reference
# (10 Central · 20 Copperbelt · 30 Eastern · 40 Luapula · 50 Lusaka ·
#  60 Northern · 70 North Western · 80 Southern · 90 Western · 91 Muchinga),
# not Ethiopia's two-letter region ids — a scope the marts cannot match is a
# scope that silently returns nothing.
#
# R-RHB-OROMIA has no meaning here; the scoped provincial role is
# R-PHO-LUSAKA (see roles.yaml).
#
# Realm reference:
#   moh-staff       — MoH staff (BI, admin, workshop)
#   privileged-ops  — privileged actions (admin, sec)

