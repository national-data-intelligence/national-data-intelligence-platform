# ops catalog — PG connector → nhdw_ops.ops_audit + ops_export (read-only).
# The Admin Audit page and the Export-history widget read through this.
connector.name=postgresql
connection-url=jdbc:postgresql://postgres-vault:5432/nhdw_ops
connection-user=ops_reader
connection-password=${ENV:OPS_READER_PASSWORD}
case-insensitive-name-matching=true
postgresql.array-mapping=AS_ARRAY
