# Catalog of every filter (global or local). Loaded into ops_perm.filter.
# source: how the resolver fetches the canonical value set.
#   static       → static_values is the full canonical list
#   mart_query   → source_ref is a mart view to SELECT DISTINCT from
#   ops_db_query → source_ref is an ops-DB table/view (e.g. user's groups)
#
# A role's allowed_values is intersected with whatever this catalog returns.
# If you want to add a filter dimension that's never appeared before
# (e.g. 'partner_org'), add a catalog row here + reference it from
# role_grants.yaml. No code change needed.

- id: region
  title: Region (admin-1)
  source: mart_query
  source_ref: marts.dim_geography
  static_values: null

- id: woreda
  title: Woreda (admin-3)
  source: mart_query
  source_ref: marts.dim_geography
  static_values: null

- id: facility
  title: Facility
  source: mart_query
  source_ref: marts.dim_facility
  static_values: null

- id: programme
  title: Programme
  source: static
  source_ref: null
  static_values: [HIV, TB, EPI, MNCH, NCD, Malaria, FP, Nutrition]

# Commodity is a PLAIN UI narrowing filter (like 'period') — it has NO scope
# dimension (absent from app/dimensions.py::FILTER_DIMENSION), so it is always
# wildcard and never role-capped; it narrows purely via the fetchers' commodity
# column WHERE. static_values are the EXACT commodity_name values in the supply
# marts (bi_supply.mart_supply_region_stock / mart_resource_allocation).
- id: commodity
  title: Commodity
  source: static
  source_ref: null
  static_values:
    ["Amlodipine 5mg", "Amoxicillin 250 DT", "Artemether-Lumefantrine",
     "BCG vaccine", "COVID-19 vaccine", "Combined oral contracept.",
     "Depo-Provera", "Fortified blended food", "GeneXpert cartridge",
     "HIV RDT kit", "HPV vaccine", "IPV (inactivated polio)", "Implanon NXT",
     "Insulin · regular 100 IU", "Iron-folate", "Isoniazid 300mg",
     "LLIN bed net", "Losartan 50mg", "Magnesium sulphate 50%",
     "Malaria RDT pf/pv", "Measles-Rubella", "Metformin 500mg",
     "OPV trivalent", "ORS sachet", "Oxytocin 10 IU/ml", "PCV-13",
     "Paracetamol 500mg", "Pediatric ART", "Pentavalent DTwP-HepB-Hib",
     "RHZE fixed-dose combo", "RUTF (ready-to-use)", "Rotavirus vaccine",
     "TLD · adult ART", "Tetanus toxoid"]

