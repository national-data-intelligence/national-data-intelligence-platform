# Observability stack (#81) — Prometheus + Loki + Alertmanager + Promtail.
# Grouped so the whole plane is one entry (`- observability`) in the base
# kustomization and can be reasoned about / toggled as a unit. Lightweight plain
# manifests only — NO kube-prometheus-stack, NO Helm (kustomize only).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nhdw
resources:
  - prometheus.yaml
  - loki.yaml
  - alertmanager.yaml
  - promtail.yaml
