# Cilium + Hubble values for the NHDW CNI install (P4 k3d path; P5 reuses for k3s).
# Mirrors the flags bundle/scripts/bootstrap.sh passes via --set, but as a values file so the
# hubble.metrics list needs no shell-escaping (clearer + maintainable).
operator:
  replicas: 1
  image: { pullPolicy: IfNotPresent, useDigest: false }
ipam:
  mode: kubernetes
image:
  pullPolicy: IfNotPresent
  # useDigest=false: the chart otherwise pins @sha256 and BYPASSES the tag-imported bundle tars,
  # forcing slow network pulls on a cold/offline boot (found on first boot: agent stuck Pulling).
  useDigest: false
# Envoy embedded (no separate DaemonSet) = one fewer image to bundle.
envoy:
  enabled: false
prometheus:
  enabled: true
hubble:
  enabled: true
  relay:
    enabled: true
    image: { pullPolicy: IfNotPresent, useDigest: false }
  # Flow/TCP/drop/DNS metrics feed the admin topology page's real per-pod flow data (#38).
  metrics:
    enabled:
      - "flow:sourceContext=workload-name|pod-name;destinationContext=workload-name|pod-name;labelsContext=source_namespace,destination_namespace"
      - "tcp:sourceContext=workload-name|pod-name;destinationContext=workload-name|pod-name;labelsContext=source_namespace,destination_namespace"
      - "drop:sourceContext=workload-name|pod-name;destinationContext=workload-name|pod-name;labelsContext=source_namespace,destination_namespace"
      - "dns"
