# Feature query for EWARS-lite. Needs cases + climate (rainfall/temp/humidity) +
# region_id (fixed effects) + population per (woreda x disease x week). Full
# history so lags + the endemic channel can be built.
input:
  query: |
    SELECT woreda_uid,
           disease_code,
           region_id,
           year,
           week,
           week_start,
           cases,
           rainfall_mm,
           temp_celsius,
           humidity_pct,
           population
    FROM bi_idsr.mart_ml_disease_input
    ORDER BY woreda_uid, disease_code, year, week
  signature:
    - { name: woreda_uid,   dtype: string }
    - { name: disease_code, dtype: string }
    - { name: region_id,    dtype: string }
    - { name: year,         dtype: int }
    - { name: week,         dtype: int }
    - { name: week_start,   dtype: date }
    - { name: cases,        dtype: int }
    - { name: rainfall_mm,  dtype: float }
    - { name: temp_celsius, dtype: float }
    - { name: humidity_pct, dtype: float }
    - { name: population,   dtype: float }
