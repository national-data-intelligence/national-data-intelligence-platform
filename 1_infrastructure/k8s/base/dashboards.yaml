# Remaining 4 dashboards (internal-bi already split into its own file).
# All bundle the same Keycloak PKCE + gateway-proxy pattern; only the
# realm/client/port envs differ.

# ─── admin · privileged-ops realm · port 8086 ───────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: admin, namespace: nhdw, labels: { app: admin, tier: dashboard } }
spec:
  replicas: 1
  selector: { matchLabels: { app: admin } }
  template:
    metadata: { labels: { app: admin, tier: dashboard } }
    spec:
      containers:
        - name: dashboard
          image: nhdw-registry:5500/nhdw/admin:v1782690463
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 80, name: http } ]
          env:
            - { name: DEV_AUTH,             value: "false" }
            - { name: KEYCLOAK_BASE,        value: "http://keycloak.nhdw.svc.cluster.local:8080" }
            - { name: KEYCLOAK_PUBLIC_BASE, value: "http://127.0.0.1:8090" }
            - { name: OIDC_REALM,           value: "privileged-ops" }
            - { name: OIDC_CLIENT_ID,       value: "admin" }
            - { name: OIDC_REDIRECT_URI,    value: "http://127.0.0.1:8086/" }
            - { name: APP_BASE,             value: "http://127.0.0.1:8086" }
            - { name: GATEWAY_URL,          value: "http://nhdw-gateway.nhdw.svc.cluster.local:8000" }
          readinessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 3, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: admin, namespace: nhdw, labels: { app: admin } }
spec:
  selector: { app: admin }
  ports: [ { port: 80, targetPort: http, name: http } ]

