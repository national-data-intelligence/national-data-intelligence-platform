    # dashboard above (topology / DQ / users / SSO). Aligned Plane-1 to Plane-2
    # (same fix as R-STEW / the #69 donor husk): keep only the non-mart widgets
    # that render (governance audit trail + settings); the operational data pages
    # elide. See the R-STEW block for the docs line-445 owner note.
    internal-bi:
    - ex-audit-trail
    - st-alert-subs
    - st-display
    - st-profile
    - st-security
    workshop:
