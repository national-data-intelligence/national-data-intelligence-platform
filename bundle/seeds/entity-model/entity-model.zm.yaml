# ─────────────────────────────────────────────────────────────────────────────
# Entity model · zm-v1 · Zambia
#
# The data layer of the Zambian country profile. build_sample.py reads this the
# same way it reads entity-model.yaml for Ethiopia, and every source generator
# consumes the sample it emits.
#
# WHAT IS REAL, AND WHAT IS NOT. This matters more than anything else in the
# file, because a demo that cannot say which of its numbers are real is worse
# than one with none.
#
#   REAL — lifted from the eLMIS 2016-2018 archive already ingested through the
#   pipeline, via bundle/profiles/zm-v1/reference.json:
#     regions            the 10 provinces, weighted by their true facility share
#     district_count     108
#     facility_count     2,807
#     facility_tiers     the eLMIS facility types that actually have facilities,
#                        each with its REAL count from the registry
#     facility_registry  all 2,807 facilities with real GPS, pulled from the
#                        deployed warehouse (bi_supply.mart_pct_facility_geo)
#     supply_programmes  the 11 eLMIS programmes (ARV, LAB, …)
#     commodities        the 64 tracer products, each with its eLMIS programme
#
#   SYNTHESISED — Zambia's archive is a SUPPLY archive. It carries no disease
#   surveillance, no service-delivery indicators and no workforce, so these have
#   no Zambian source and are modelled on the Ethiopian set:
#     programmes         the health-programme taxonomy the indicator lane needs
#     indicators         service-delivery indicators
#     cadres             workforce mix (WHO targets are international)
#     epss_hubs          two hubs, standing in for the national supply network
#
#   INFERRED:
#     regions[].capital / epss_hub   provincial capitals and their nearest hub
#     facility_tiers[].ownership_mix read from the facility type's own name
#                                    (CHAZ and mission facilities are NGO, and
#                                    so on) — not measured
#
# The supply lane is therefore the honest one to demo on Zambian data. Say so.
# ─────────────────────────────────────────────────────────────────────────────

# disease_response is EMPTY on purpose, not unfinished: the archive carries no
# notifiable-disease surveillance, zm-v1's reference reports 0 diseases, and
# zm-v1/catalog.yaml already disables the surveillance widgets for exactly
# that reason. Inventing a disease→commodity map here would contradict the
# profile that disables the pages meant to show it.

