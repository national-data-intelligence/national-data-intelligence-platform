# OpenMetadata — catalog / glossary / column lineage / classification surface.
#
# Backend store : postgres-vault / nhdw_openmetadata (writer = openmetadata_writer,
#                 init/37_openmetadata_db.sh)
# Search        : opensearch:9200 (opensearch.yaml — OM is its only consumer)
# NEVER in the enforcement path: OPA reads the committed ops_perm seed;
# classification flows one-way OM → ops_perm (sync task, batch 1 chunk B5).
#
# The db-migrate initContainer runs OM's own schema migrations before the
# server starts (OM refuses to boot against an unmigrated DB). The pipeline
# service client is disabled: connector ingestion runs as our own Airflow
# KubernetesPodOperator DAG, not from inside OM.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmetadata
  namespace: nhdw
  labels: { app: openmetadata, tier: metadata }
spec:
  replicas: 1
  selector: { matchLabels: { app: openmetadata } }
  template:
    metadata:
      labels: { app: openmetadata, tier: metadata }
    spec:
      initContainers:
        - name: db-migrate
          image: docker.getcollate.io/openmetadata/server:2.0.2
          imagePullPolicy: IfNotPresent
          command: [ "./bootstrap/openmetadata-ops.sh", "migrate" ]
          envFrom: [ { configMapRef: { name: openmetadata-env } } ]
          env:
            - name: DB_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: openmetadata-secrets, key: DB_PASSWORD } }
      containers:
        - name: openmetadata
          image: docker.getcollate.io/openmetadata/server:2.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8585, name: http }
            - { containerPort: 8586, name: admin }
          envFrom: [ { configMapRef: { name: openmetadata-env } } ]
          env:
            - name: DB_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: openmetadata-secrets, key: DB_PASSWORD } }
          resources:
            requests: { memory: "2Gi", cpu: "500m" }
            limits:   { memory: "3Gi" }
          readinessProbe:
            httpGet: { path: /healthcheck, port: admin }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthcheck, port: admin }
            initialDelaySeconds: 120
            periodSeconds: 30
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openmetadata-env
  namespace: nhdw
  labels: { app: openmetadata, tier: metadata }
data:
  OPENMETADATA_CLUSTER_NAME: "nhdw"
  SERVER_PORT: "8585"
  SERVER_ADMIN_PORT: "8586"
  LOG_LEVEL: "INFO"
  # backend store (init/37_openmetadata_db.sh)
  DB_DRIVER_CLASS: "org.postgresql.Driver"
  DB_SCHEME: "postgresql"
  DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
  DB_USER: "openmetadata_writer"
  DB_HOST: "postgres-vault.nhdw.svc.cluster.local"
  DB_PORT: "5432"
  OM_DATABASE: "nhdw_openmetadata"
  # search backend
  SEARCH_TYPE: "opensearch"
  ELASTICSEARCH_HOST: "opensearch"
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_SCHEME: "http"
  # connector ingestion runs as our own Airflow DAG (KubernetesPodOperator);
  # OM's built-in pipeline client stays off.
  PIPELINE_SERVICE_CLIENT_ENABLED: "false"
  # java heap
  OPENMETADATA_HEAP_OPTS: "-Xmx2G -Xms2G"
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata
  namespace: nhdw
  labels: { app: openmetadata, tier: metadata }
spec:
  type: ClusterIP
  selector: { app: openmetadata }
  ports:
    - { port: 8585, targetPort: http, name: http }
