{{- $c := index .Values.components "gateway" -}}
# HorizontalPodAutoscaler for the gateway (the Scalability demo). CPU >60% of the
# requested 100m → scale 1..maxReplicas; metrics from metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nhdw-gateway
  namespace: {{ .Values.namespace }}
  labels: { app: nhdw-gateway, tier: access }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: nhdw-gateway }
  minReplicas: {{ $c.replicas }}
  maxReplicas: {{ $c.maxReplicas | default 6 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Percent, value: 100, periodSeconds: 15 }
        - { type: Pods,    value: 2,   periodSeconds: 15 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - { type: Pods, value: 1, periodSeconds: 30 }
