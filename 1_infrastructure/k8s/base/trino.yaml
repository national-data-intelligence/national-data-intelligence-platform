# Trino — the single federated SQL engine (marts + ops + lake/MinIO).
# The gateway is the PEP: it calls OPA and applies the row_filter BEFORE the
# query reaches Trino; Trino uses least-privilege readers (bi_reader/ops_reader).
# Catalogs: marts (PG nhdw_vault bi_*), ops (PG nhdw_ops audit/export),
# lake (Iceberg over MinIO nhdw-lake — the processed/landing/archived zones).
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-etc
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    query.max-memory=2GB
    query.max-memory-per-node=1GB
  jvm.config: |
    -server
    -Xmx2600m
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -Dfile.encoding=UTF-8
  node.properties: |
    node.environment=nhdw
    node.data-dir=/data/trino
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog
data:
  # decimal-mapping=allow_overflow: dbt marts emit unparameterized NUMERIC
  # (round()/avg() outputs); the connector's STRICT default silently HIDES such
  # columns from every Trino consumer — widget fetchers 502'd on them. Fixed at
  # the catalog (the source of the contract) so ALL consumers see the columns;
  # the gateway additionally sets the same session property for safety.
  marts.properties: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://postgres-vault:5432/nhdw_vault
    connection-user=bi_reader
    connection-password=${ENV:BI_READER_PASSWORD}
    case-insensitive-name-matching=true
    postgresql.array-mapping=AS_ARRAY
    decimal-mapping=allow_overflow
    decimal-default-scale=4
    decimal-rounding-mode=HALF_UP
  ops.properties: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://postgres-vault:5432/nhdw_ops
    connection-user=ops_reader
    connection-password=${ENV:OPS_READER_PASSWORD}
    case-insensitive-name-matching=true
    postgresql.array-mapping=AS_ARRAY
    decimal-mapping=allow_overflow
    decimal-default-scale=4
    decimal-rounding-mode=HALF_UP
  # NOTE: the `lake` catalog (Iceberg over MinIO, for the landing/processed/archived
  # zones) is its own workstream — it needs (a) the correct Trino-476 native-S3
  # Iceberg config, and (b) a marts->Parquet snapshot job to actually create Iceberg
  # tables in the nhdw-lake bucket (none exist yet). A misconfigured catalog is FATAL
  # to Trino startup, so it's added only once its config + data are validated.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhdw-trino
  # tier: compute — the federated SQL engine. Used by the topology graph
  # (/api/topology/graph) as the node's tier; without it Trino mis-buckets.
  labels: { app: nhdw-trino, tier: compute }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nhdw-trino }
  template:
    metadata:
      labels: { app: nhdw-trino, tier: compute }
    spec:
      containers:
        - name: trino
          image: trinodb/trino:476
          ports:
            - containerPort: 8080
          env:
            - name: BI_READER_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-vault-secrets, key: BI_READER_PASSWORD } }
            - name: OPS_READER_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-vault-secrets, key: OPS_READER_PASSWORD } }
            - name: MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER } }
            - name: MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } }
          volumeMounts:
            - { name: etc, mountPath: /etc/trino/config.properties, subPath: config.properties }
            - { name: etc, mountPath: /etc/trino/jvm.config, subPath: jvm.config }
            - { name: etc, mountPath: /etc/trino/node.properties, subPath: node.properties }
            - { name: catalog, mountPath: /etc/trino/catalog }
            - { name: data, mountPath: /data/trino }
          resources:
            requests: { cpu: "250m", memory: "1800Mi" }
            limits:   { cpu: "2",    memory: "3584Mi" }
          readinessProbe:
            httpGet: { path: /v1/info, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /v1/info, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: etc
          configMap: { name: trino-etc }
        - name: catalog
          configMap: { name: trino-catalog }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nhdw-trino
  labels: { app: nhdw-trino, tier: compute }
spec:
  selector: { app: nhdw-trino }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
