apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data, namespace: nhdw }
spec:
  accessModes: [ ReadWriteOnce ]
  storageClassName: local-path
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio-datalake, namespace: nhdw, labels: { app: minio-datalake, tier: storage } }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio-datalake } }
  template:
    metadata: { labels: { app: minio-datalake, tier: storage } }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-02-28T09-55-16Z
          args: [ "server", "/data", "--console-address", ":9001" ]
          ports:
            - { containerPort: 9000, name: s3 }
            - { containerPort: 9001, name: console }
          env:
            - { name: MINIO_ROOT_USER,     valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
            # ── Console SSO via Keycloak OIDC (privileged-ops) ──────────────────
            # The console is fronted by traefik at the public https host but runs
            # http :9001 internally, so BROWSER_REDIRECT_URL pins its external URL
            # (used to build the OIDC redirect_uri /oauth_callback and TLS links).
            - { name: MINIO_BROWSER_REDIRECT_URL, value: "https://minio-console.127.0.0.1.nip.io" }
            # CONFIG_URL points at the INTERNAL keycloak:8080 — KC_HOSTNAME_
            # BACKCHANNEL_DYNAMIC=true makes discovery return a PUBLIC auth_endpoint
            # (browser-reachable) but INTERNAL token/jwks (server-reachable), so the
            # split-horizon "just works" (same trick JupyterHub/oauth2-proxy use).
            - { name: MINIO_IDENTITY_OPENID_CONFIG_URL,   value: "http://keycloak:8080/realms/privileged-ops/.well-known/openid-configuration" }
            - { name: MINIO_IDENTITY_OPENID_CLIENT_ID,    value: "minio-console" }
            - { name: MINIO_IDENTITY_OPENID_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: minio-oidc-secrets, key: OIDC_CLIENT_SECRET, optional: true } } }
            # ROLE_POLICY maps every OIDC-authenticated (privileged-ops) operator to
            # the built-in consoleAdmin policy via AssumeRoleWithWebIdentity — no
            # per-user claim mapper needed. Only R-OPS-* users can reach this realm.
            - { name: MINIO_IDENTITY_OPENID_ROLE_POLICY,  value: "consoleAdmin" }
            - { name: MINIO_IDENTITY_OPENID_SCOPES,       value: "openid,profile,email" }
            - { name: MINIO_IDENTITY_OPENID_REDIRECT_URI, value: "https://minio-console.127.0.0.1.nip.io/oauth_callback" }
            - { name: MINIO_IDENTITY_OPENID_DISPLAY_NAME, value: "NHDW Single Sign-On" }
          volumeMounts: [ { name: data, mountPath: /data } ]
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: minio-data } }
---
apiVersion: v1
kind: Service
metadata: { name: minio-datalake, namespace: nhdw, labels: { app: minio-datalake } }
spec:
  selector: { app: minio-datalake }
  ports:
    - { port: 9000, targetPort: s3,      name: s3 }
    - { port: 9001, targetPort: console, name: console }
