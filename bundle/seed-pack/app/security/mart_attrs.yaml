# Catalog the gateway uses to enrich OPA input on every mart read.
# Loaded into ops_perm.mart_attrs.
#
# OPA's role policies branch on data_class / granularity / sensitivity
# in addition to subject — the on-the-wire table name carries none of
# those, so the gateway joins on this catalog before calling OPA. A
# mart absent from this file is denied under OPA_ENFORCE=true, and the
# ad-hoc SQL editor (routes/sql_lab.py) rejects it as "not cataloged".
#
# schema_name / table_name MUST match the ACTUAL deployed relation the
# SQL parser sees (e.g. FROM bi_facility.mart_health_workforce → schema
# bi_facility, table mart_health_workforce). subject/data_class mirror
# the widget fetchers (app/fetchers.py) so an ad-hoc SELECT and a widget
# read of the same mart get the identical OPA decision.
#
# data_class values — CONSTRAINED to this exact set by the mart_attrs CHECK
# constraint (ops_perm.mart_attrs_data_class_check):
#   DC.PRO   programme / process       (coverage, cascade, EPI safety)
#   DC.PRF   performance / facility    (facility scorecards, workforce, data quality)
#   DC.STK   stock / commodity         (stock-on-hand, dispensing, procurement)
#   DC.ENC   patient encounter · DC.CND condition · DC.OBS observation
#   DC.MED   medication  · DC.AEFI adverse event
# (Widget fetchers may declare finer classes like DC.CAT/DC.QLT directly to OPA;
#  those bypass this catalog. Here, map to the nearest allowed class above.)
#
# granularity: raw | aggregate | deidentified
# default_sensitivity: default | restricted | privileged
#
# When a new mart lands, add a row here BEFORE granting widget access to it.

