name: ears
version: v1
kind: detector
deployment_kind: batch
engine: python-endemic-channel
provenance: ears
description: >-
  WHO EARS endemic-channel aberration detector. Baseline = mean + sd of the
  same ISO-week in other years (falls back to a rolling preceding-8-week window
  when < 2 years of history). Threshold = mean + k*sd (k=3); emits the flat
  forecast schema with an endemic band + alarm probability per week.
actuals:
  mart: bi_idsr.mart_ml_disease_input
  value_col: cases
  join_keys:
    district: woreda_uid
    disease: disease_code
    year: year
    week: week
