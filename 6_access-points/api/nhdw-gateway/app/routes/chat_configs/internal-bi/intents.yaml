# Suggested prompts shown to the user when the chat panel opens.
# Per-role lists — the chat endpoint picks the right list based on the
# user's primary_role at /api/chat/intro time.
#
# Keep each suggestion short (≤ 60 chars) so chips fit on one line.

default:
  - "What's on this page?"
  - "Take me to the HIV cascade"
  - "Which woredas had the highest disease alarm last week?"

R-DEC:
  - "Top-stress regions right now?"
  - "Stockouts in the next 14 days?"
  - "Show MNCH continuum"
  - "Which programmes missed HSTP-II targets?"

R-RHB-OROMIA:
