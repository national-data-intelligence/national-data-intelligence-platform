<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="National Health Data Warehouse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#072b21"/>
      <stop offset="0.55" stop-color="#0c4633"/>
      <stop offset="1" stop-color="#093a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#1fa363" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1fa363" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe9b8"/>
      <stop offset="1" stop-color="#2fb277"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>

  <!-- pipeline motif: sources -> warehouse -> dashboards, three tiers of nodes -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.4" fill="none">
    <path d="M905,96 L1035,120 M905,96 L1035,180 M905,170 L1035,120 M905,170 L1035,180 M905,244 L1035,180 M905,244 L1035,240"/>
    <path d="M1035,120 L1168,110 M1035,180 L1168,110 M1035,180 L1168,180 M1035,240 L1168,180 M1035,240 L1168,250"/>
  </g>
  <g fill="url(#node)">
    <circle cx="905" cy="96" r="7"/><circle cx="905" cy="170" r="7"/><circle cx="905" cy="244" r="7"/>
    <circle cx="1035" cy="120" r="9"/><circle cx="1035" cy="180" r="9"/><circle cx="1035" cy="240" r="9"/>
    <circle cx="1168" cy="110" r="7"/><circle cx="1168" cy="180" r="7"/><circle cx="1168" cy="250" r="7"/>
  </g>

  <!-- tricolour accent -->
  <g>
    <rect x="90" y="86" width="7" height="150" rx="3.5" fill="#1fa363"/>
    <rect x="90" y="86" width="7" height="50" rx="3.5" fill="#1fa363"/>
    <rect x="90" y="136" width="7" height="50" fill="#f4c430"/>
    <rect x="90" y="186" width="7" height="50" rx="3.5" fill="#d7263d"/>
  </g>

  <text x="122" y="96" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#8fbba9">ETHIOPIA · FEDERAL MINISTRY OF HEALTH</text>

  <text x="120" y="164" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="700" fill="#f4f9f6">National Health</text>
  <text x="120" y="232" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="700" fill="#f4f9f6">Data Warehouse</text>

  <text x="122" y="280" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#a9c7bc">Governed ingestion, a Data Vault warehouse, and role-aware analytics — on Kubernetes.</text>

  <rect x="122" y="304" width="70" height="4" rx="2" fill="#1fa363"/>
  <rect x="196" y="304" width="70" height="4" rx="2" fill="#f4c430"/>
  <rect x="270" y="304" width="70" height="4" rx="2" fill="#d7263d"/>
</svg>
