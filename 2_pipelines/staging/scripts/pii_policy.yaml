  dhis2/data_elements: { drop: [] }
  dhis2/data_sets: { drop: [] }
  dhis2/data_sets__data_set_elements: { drop: [] }
  dhis2/data_sets__organisation_units: { drop: [] }
  dhis2/data_value_sets:
    drop:
      - stored_by  # Data-entry username (DHIS2 storedBy, see ingestor data_value_sets.py:103); sampled values 
  dhis2/organisation_units: { drop: [] }

  # ── ethioemr ────────────────────────────────────────────────
  ethioemr/encounter:
    drop:
      - subject__display  # Patient full name (given_name + family_name from OpenMRS person_name; sampled 'Aman Haile'
      - subject__identifier__system  # System partner of the patient MRN identifier ('OpenMRS Identification Number'); dropped wi
      - subject__identifier__value  # Person-level identifier value — patient MRN (sampled 'MRN00000001')
  ethioemr/observation:
    drop:
      - subject__display  # Patient full name (same _display_name(given+family) as encounter; sampled 'Aman Haile')
      - value_string  # Free-text observation value mapped from OpenMRS obs.value_text — can embed names/notes/PII
  ethioemr/patient:
    drop:
      - birth_date  # Personal date of birth — quasi-identifier (sampled '2012-04-22', '1939-06-22')
      - text__div  # FHIR narrative HTML that embeds the patient's full name (sampled '<div ...>Aman Haile</div

