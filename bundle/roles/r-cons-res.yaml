# R-CONS-RES — External Researcher (DSA-bounded)
#
# Authoritative spec: docs/user-roles.md §3.
# Intentional deny-all on internal marts. External researchers only get
# k-anonymised public-tier marts (a separate set under marts_public.*
# that don't yet exist in the demo). Their workshop access is governed
# by workshop_group_membership, not OPA.
role:
  id: R-CONS-RES
  name: "External Researcher"
  group: Consumer
  identity_provider: MoH-Keycloak
  mfa_required: true
  mfa_factor: TOTP
  phase_activated: 1
  audit_class: enhanced
  notes: |
    DC.CAT carve-out (2026-07-03): same catalogue-metadata rationale as R-CONS-SCI.
    DSA-bounded external research access. Internal mart access denied;
    a future R-CONS-RES-PUBLIC role will grant read on marts_public.*
    after k-anon review.
  intentional_deny: true
  permissions:
    - subject: PRG
      data_class: [DC.CAT]
      members: all
      granularity: aggregate
      sensitivity: []
      verbs: [read]
      purpose_of_use: [public-health]
