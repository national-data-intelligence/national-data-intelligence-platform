# External LLM (Ollama) — the dashboard assistant's model runtime, EXTERNAL to the
# NHDW k8s cluster, exactly like every other 0_external/ system (sources + fayda):
# in production the model server is a backing resource run outside the warehouse,
# so it lives here as a docker-compose stack, NOT a k8s manifest.
#
# ┌─ Why external (WSL2 GPU reality, verified 2026-07-06) ──────────────────────┐
# │ A GPU CANNOT be used from inside a nested k3d node→pod on WSL2 (ollama's     │
# │ cuInit → error 304 CUDA_ERROR_OPERATING_SYSTEM + SIGSEGV). The ONLY working  │
# │ 14b-on-GPU path on this host is this STOCK ollama container run DIRECTLY on   │
# │ the host docker daemon with the GPU passed through. 14b = ~25 tok/s on the   │
# │ RTX 5080 vs ~1.3 tok/s on CPU. See README.md + baremetal/ for the bare-metal │
# │ Linux in-cluster alternative.                                                │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# Published on 0.0.0.0:11434 so the gateway pod (in k8s) reaches it at
# http://host.k3d.internal:11434 (the k3d host route — the same pattern the source
# replicas + fayda use). Brought up by bundle/scripts/sources-up.sh (up_llm),
# alongside the source replicas.
#
# CPU by DEFAULT — this base file runs unchanged on a CPU-only host (no --gpus
# needed). GPU is an ADDITIVE overlay: sources-up.sh layers `-f docker-compose.gpu.yml`
# on top ONLY when the host advertises an NVIDIA GPU (nvidia-smi). Same base compose
# either way.
#
# Weights: ./models is the ollama home (mounted at /root/.ollama). It ships in the
# bundle with BOTH qwen2.5:3b (CPU-interactive default) and qwen2.5:14b (GPU) already
# pulled, so there is NO network pull at bring-up. The image is STOCK
# ollama/ollama:0.6.8 (already a bundled image tar) — the external path needs no
# custom baked image (that baked image, image/, is only for the bare-metal recipe).
services:
  ollama:
    image: ollama/ollama:0.6.8
    container_name: nhdw-ollama
    restart: unless-stopped
    environment:
      OLLAMA_MODELS: /root/.ollama/models
      # Keep the loaded model resident between turns (matches the gateway's
      # per-request keep_alive default in routes/chat.py) so a 14b answer never
      # pays cold-reload latency mid-demo.
      OLLAMA_KEEP_ALIVE: "24h"   # keep the model resident across demo idle gaps (no cold VRAM reloads)
    ports:
      - "11434:11434"        # 0.0.0.0 — reachable from k3d pods via host.k3d.internal
    volumes:
      - ./models:/root/.ollama
    healthcheck:
      # `ollama list` succeeds only once the daemon is serving on :11434 — the same
      # readiness the gateway depends on (/api/tags). The ollama CLI ships in the image.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [llm_net]

# Private bridge only — this is the outside world; it has NO nhdw_net attachment
# (pods reach it via host.k3d.internal, never a shared docker network).
networks:
  llm_net:
    driver: bridge
