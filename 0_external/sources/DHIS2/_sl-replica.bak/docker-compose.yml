# DHIS2 replica — full DHIS2 Java app + PostGIS backend.
#
# Real-world equivalent: ethio-dhis2.dataforimplementation.org (HTTPS, OAuth /
# Basic Auth, paginated JSON Web API at /api/...).
# Replica matches the same Web API on http://127.0.0.1:8080/api/...
#
# First boot:
#   1. cp .env.example .env
#   2. docker compose up -d dhis2-db
#   3. bash scripts/restore.sh   (downloads Sierra Leone demo DB, restores)
#   4. docker compose up -d dhis2
#   5. wait ~10-15 min for schema migrations + analytics tables
#   6. bash scripts/verify.sh

services:
  dhis2-db:
    image: postgis/postgis:14-3.3
    container_name: dhis2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DHIS2_DB_NAME:-dhis2}
      POSTGRES_USER: ${DHIS2_DB_USER:-dhis}
      POSTGRES_PASSWORD: ${DHIS2_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ${DHIS2_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DHIS2_DB_USER:-dhis} -d ${DHIS2_DB_NAME:-dhis2}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - dhis2_net
      - nhdw_net

  dhis2:
    image: dhis2/core:${DHIS2_VERSION:-2.40.4}
    container_name: dhis2-web
    restart: unless-stopped
    depends_on:
      dhis2-db:
        condition: service_healthy
    environment:
      # DHIS2 reads connection settings from these env vars.
      DHIS2_DATABASE_HOST: dhis2-db
      DHIS2_DATABASE_PORT: 5432
      DHIS2_DATABASE_NAME: ${DHIS2_DB_NAME:-dhis2}
      DHIS2_DATABASE_USERNAME: ${DHIS2_DB_USER:-dhis}
      DHIS2_DATABASE_PASSWORD: ${DHIS2_DB_PASSWORD}
      # JVM heap — DHIS2 wants at least 4 GB for migrations on a non-trivial DB.
      JAVA_OPTS: "-Xms2g -Xmx6g -XX:+UseG1GC -Dfile.encoding=UTF-8"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${DHIS2_DATA_DIR:-./data}/dhis2-home:/opt/dhis2
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/system/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s
    networks:
      - dhis2_net
      - nhdw_net

networks:
  dhis2_net:
    driver: bridge
  nhdw_net:
    external: true
