<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Demo Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png">
</head>
<body>

<!-- The ground everything floats on. Drawn in CSS from the same tokens as the
     rest of the interface, so it harmonises by construction and stays crisp at
     any size instead of being an upscaled photograph. -->
<div class="ground" aria-hidden="true"></div>

<!-- ── sign in ───────────────────────────────────────────────────────────── -->
<div id="signin" class="signin" hidden>
  <div class="login">
    <!-- Three zones, not a stack: the mark is anchored at the top, the form is
         optically centred in whatever space is left, and the ways out are
         pinned to the foot behind a hairline. The zones hold while the middle
         one changes between the four forms. -->
    <div class="login-form">
      <div class="login-head">
        <!-- The Palladium lockup. It is an alpha MASK painted in the theme's own
             ink, so it sits correctly on white and on near-black and carries no
             background of its own. -->
        <div class="brand-lg">
          <span class="pal-logo" role="img" aria-label="Palladium — make it possible"></span>
          <span class="pal-sub">Demo Console</span>
        </div>
      </div>
      <div class="login-main">
        <h1 id="login-title">Sign in</h1>
        <p class="login-lede" id="login-lede"></p>
        <div id="login-body"></div>
      </div>
      <div class="login-foot" id="login-foot"></div>
    </div>
    <!-- The artwork sits on black already, so `screen` blending drops its ground
         into the panel rather than cutting a rectangle out of it — that is the
         background removal, done at paint time. Swap ART in app.js for the
         other file, or set it to null to get the rotating globe back. -->
    <div class="login-art" aria-hidden="true">
      <div class="login-art-img" id="login-art-img"></div>
      <canvas id="signin-canvas" hidden></canvas>
    </div>
  </div>
</div>

<!-- ── the app ───────────────────────────────────────────────────────────── -->
<div id="app" class="shell" hidden>

  <!-- The sidebar runs the FULL height of the card. It is the console's own
       furniture — the mark, where you can go, what you are waiting on — and
       furniture that stops partway down reads as a panel that slid out of
       place. The topbar belongs to the content beside it, not across it. -->
  <aside class="side">
    <a class="brand" href="#/projects">
      <span class="pal-mark" role="img" aria-label="Palladium"></span>
      <span class="wordmark">Demo <b>Console</b></span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a class="nav-i" data-route="projects" href="#/projects">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h2.7l1.6 2H17.5A2.5 2.5 0 0 1 20 10.5v6A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        <span>Projects</span>
      </a>
      <!-- console admins only; boot() hides it and the route refuses anyway -->
      <a class="nav-i" data-route="admin" id="nav-admin" href="#/admin/people" hidden>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.5 5 6.4v5c0 4.2 2.9 8 7 9.1 4.1-1.1 7-4.9 7-9.1v-5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9.2 12 2 2 3.6-3.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Admin</span>
      </a>
      <a class="nav-i" data-route="settings" href="#/settings">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.6v2M12 18.4v2M20.4 12h-2M5.6 12h-2M17.9 6.1l-1.4 1.4M7.5 16.5l-1.4 1.4M17.9 17.9l-1.4-1.4M7.5 7.5 6.1 6.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <!-- The estate summary lives in the topbar, where it is visible on every
         screen. What stays here is the one thing that is about YOU: the job
         you started, which has to survive navigating away from it. -->
    <div class="side-foot">
      <div class="sidelabel"><span>Running now</span><i></i></div>
      <div id="running" class="meterbox"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <!-- The estate, always visible wherever you are. It replaced a search box
           that only opened the palette; the palette has its own button on the
           right, and this space now carries something worth looking at. -->
      <div class="estatebar" id="estatebar" aria-live="polite"></div>

      <div class="topright">
        <button class="iconbtn" id="btn-search" type="button"
                title="Search projects and screens" aria-label="Search projects and screens">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.4" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="iconbtn" id="btn-theme" type="button" title="Switch between light and dark" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="2"/><path d="M12 5a7 7 0 0 0 0 14z" fill="currentColor"/></svg>
        </button>
        <div class="who">
          <span class="who-name" id="who-name"></span>
          <button class="avatar" id="btn-user" type="button" title="Sign out"></button>
        </div>
      </div>
    </header>

    <main class="canvas" id="canvas" tabindex="-1"></main>
  </div>
</div>

<!-- ── command palette ───────────────────────────────────────────────────── -->
<div id="palette" class="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search and commands">
    <div class="palette-field">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.4" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="palette-input" type="text" placeholder="Jump to a project or a screen…" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <div id="palette-list" class="palette-list"></div>
  </div>
</div>

<!-- ── the viewer ────────────────────────────────────────────────────────── -->
<!-- Everything here is the browser's own renderer: an iframe for PDF, a video
     element for video, an img for images. No library, and the download stays
     one press away whatever is on screen. -->
<div id="viewer" class="viewer" hidden>
  <div class="viewer-box" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <header class="viewer-head">
      <div style="min-width:0">
        <div class="viewer-t" id="viewer-title"></div>
        <div class="viewer-m" id="viewer-meta"></div>
      </div>
      <div class="viewer-act">
        <a class="btn sm" id="viewer-dl" href="#" download>Download</a>
        <button class="iconbtn" data-act="close-viewer" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div class="viewer-body" id="viewer-body"></div>
  </div>
</div>

<!-- ── modal + toasts ────────────────────────────────────────────────────── -->
<div id="modal" class="modal" hidden><div class="modal-box" role="dialog" aria-modal="true" id="modal-box"></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/assets/app.js" type="module"></script>
</body>
</html>
