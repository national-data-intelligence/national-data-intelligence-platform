id: pct-kpis
title: PCT · Supply KPIs (Global Fund S8 and stock health)
kind: kpi
description: >-
  National Zambia eLMIS tracer-commodity KPIs at the latest reported month:
  on-shelf availability by the Global Fund S8 method (target 90%), stockout
  exposure, stockout days and stock within the max/min policy, with the S8 trend
  against its target.
requires:
  subject: PRD
  verb: read
  granularity: aggregate
  sensitivity: default
