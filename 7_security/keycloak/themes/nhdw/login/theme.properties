# NHDW login theme — full control, no PatternFly.
# parent=base gives the message bundles + FreeMarker login model (url/realm/
# social/messagesPerField) while our own template.ftl + login.ftl own the
# entire markup, so brand.css styles clean semantic classes with nothing to
# fight. (The earlier keycloak.v2 approach lost specificity battles with
# PatternFly's compiled styles.css → the disfigured half-styled page.)
parent=base

# Our stylesheet is the ONLY one loaded (versioned name busts browser cache on redesign).
styles=css/brand.v2.css
