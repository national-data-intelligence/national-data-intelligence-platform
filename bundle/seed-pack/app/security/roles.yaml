# Role catalog. Loaded into ops_perm.role + ops_perm.role_capability + (Phase-1)
# ops_perm.role_scope. The 4-axis grants are in role_grants.yaml.
#
# 13 existing roles are preserved by code (matches the 13 .rego files in
# 7_security/opa/policies/). We add a few demo-scope roles (R-RHB-OROMIA and
# its Zambian counterpart R-PHO-LUSAKA, R-PD-HIV, R-PD-MNCH) for the demo
# scenarios.
#
# Optional per-role blocks (both loaded by 7_security/scripts/load_security_seed.py):
#   capabilities:  app-level powers → ops_perm.role_capability. The assistant
#                  tool-gate now lives here as `assistant:read` / `assistant:run_sql`
#                  / `assistant:interact` (Phase-1 re-home of the chatbot-tools
#                  tool groups off ops_perm.role_widget_filter — see chat.py).
#   scope:         role-level DEFAULT data scope → ops_perm.role_scope,
#                  { dimension: [values] }, dimension ∈ geography/programme/
#                  facility/mart/artifact_tier/workshop_group. PHASE 1: seeded
#                  only (dual-written alongside the role_global_filter /
#                  role_widget_filter blocks in role_grants.yaml); the resolver
#                  still enforces off those tables + user_scope until Phase 2.

- code: R-DEC
  name: Decision Maker
  description: >
    FMoH leadership. National scope, aggregate data only, exports allowed.
  combine_strategy: union
  capabilities: [assistant:read, assistant:interact]

- code: R-PROD-SUBMIT
  name: Data Producer (Submission)
  description: >
    Facility-level data producers. Submission portal access; raw write to
    their own facility's submission queue.
  combine_strategy: union
  capabilities: []

- code: R-PROD-CLIN
  name: Clinician
  description: >
    Practising clinicians (RHB / facility). Read own-patient data; submit
    care events.
  combine_strategy: union
  capabilities: []

- code: R-CONS-ANA
  name: Analyst (Consumer)
  description: >
    M&E and policy analysts. Full Internal-BI build; ad-hoc SQL on
    pre-authorised marts.
  combine_strategy: union
  capabilities: [edit_saved_query, assistant:read, assistant:run_sql, assistant:interact]

- code: R-CONS-SCI
  name: Data Scientist
  description: >
    Research scientists. Workshop access; can fork and contribute artifacts.
  combine_strategy: union
  capabilities: [create_group, submit_artifact]

- code: R-CONS-RES
  name: Researcher (External)
  description: >
    External researchers. k-anon public marts only; workshop access for
    own group's shared artifacts.
  combine_strategy: union
  capabilities: [submit_artifact]
  # Phase-1 role_scope mirror of the role_grants.yaml widget_filter
  # workshop::ws-artifact-grid artifact_tier:[public,shared] (a UI facet, not a
  # geographic data scope). Dual-written; still enforced off role_widget_filter.
  scope:
    artifact_tier: [public, shared]

- code: R-CONS-PRT
  name: Partner (Donor)
  description: >
    Donor / partner agencies. Their programme's aggregate views only;
    export allowed for cited donor reports.
  combine_strategy: union
  capabilities: []

- code: R-STEW
  name: Data Steward
  description: >
    Catalog stewards. Metadata / lineage; artifact peer-review.
  combine_strategy: union
  capabilities: [approve_grad, approve_artifact_promotion, assistant:read, manage_classification]

- code: R-OPS-ENG
  name: Operations Engineer
  description: >
    Pipeline / infra engineers. Read-only on operational dashboards;
    rerun pipelines; no data export.
  combine_strategy: union
  capabilities: [trigger_pipeline, view_ops_console]

- code: R-OPS-ADM
  name: System Admin
  description: >
    Full admin. Manage users, roles, identity sources. Edits the
    permission model itself via the admin UI.
  combine_strategy: union
  capabilities: [edit_roles, manage_users, manage_identity_sources, approve_access_request, view_ops_console, manage_catalog, manage_classification]

- code: R-OPS-SEC
  name: Security Officer
  description: >
    Audit, policy review, key rotation. Read-only on everything;
    approves privileged actions.
  combine_strategy: union
  capabilities: [approve_privileged_action, view_audit, view_ops_console, manage_classification]

- code: R-PUB-ANON
  name: Anonymous Public
  description: >
    The unauthenticated public dashboard visitor. Public landing,
    open-data catalogue, articles. No PHI.
  combine_strategy: union
  capabilities: []

# ── Demo scope roles (created so the role-spec demo flows work) ────────
- code: R-RHB-OROMIA
  name: RHB Director · Oromia
  description: >
    Regional Health Bureau director — Oromia. Same widget catalogue as
    R-DEC but with region filter constrained to Oromia.
  combine_strategy: union
  capabilities: [assistant:read, assistant:interact]
  # role_scope (#50b): THE role-level data-scope cap — the resolver derives every
  # filter's allowed values from role_scope ∩ user_scope (users.yaml scope: adds
  # the per-user row-enforcement side via OPA).
  scope:
    geography: [OR]

- code: R-PHO-LUSAKA
  name: PHO Director · Lusaka
  description: >
    Provincial Health Office director — Lusaka. The Zambian counterpart of
    R-RHB-OROMIA: the same widget catalogue as R-DEC with the geography filter
    constrained to one province. Both exist because a geographic role is a
    property of the COUNTRY, not of the platform — zm-v1's cast references this
    one, et-v3's references the other, and neither profile's users can name a
    role that means nothing where they work.
  combine_strategy: union
  capabilities: [assistant:read, assistant:interact]
  # role_scope (#50b): the role-level cap. '50' is Lusaka in the eLMIS province
  # coding the zm-v1 reference is built from — NOT a two-letter Ethiopian id,
  # which would intersect to nothing against the Zambian marts.
  scope:
    geography: ['50']

- code: R-PD-HIV
  name: Programme Director · HIV
  description: >
    FMoH PD for HIV programme. Same widgets as R-DEC but programme
    filter constrained to HIV.
  combine_strategy: union
  capabilities: [assistant:read, assistant:interact]
  # role_scope (#50b): programme cap resolved as role_scope ∩ user_scope.
  scope:
    programme: [HIV]

# ── Super-user (universal access) ──────────────────────────────────────
- code: R-SUPER
  name: Super-User
  description: >
    Wildcard access across every dashboard, widget, filter, and mart.
    Reserved for the deployment owner; every action audited at
    privileged-class.
  combine_strategy: union
  capabilities:
    - manage_users
    - manage_identity_sources
    - edit_roles
    - approve_access_request
    - approve_privileged_action
    - view_audit
    - manage_groups
    - approve_grad
    - approve_artifact_promotion
    - create_group
    - submit_artifact
    - edit_saved_query
    - trigger_pipeline
    - manage_api_tokens
    - issue_api_token_for_others
    - view_ops_console
    - act_as_owner
    - manage_catalog
    # Full assistant toolset (was chatbot-tools [read, run_sql, interact]).
    - assistant:read
    - assistant:run_sql
    - assistant:interact

# ── Platform service account (P1.1 act-as-owner) ───────────────────────
- code: R-SERVICE
  name: Platform Service Account
  description: >
    Internal service identity for background jobs (scheduled reports,
    provisioning, batch evaluation). Holds ONLY the act_as_owner capability —
    it never acts on its own broad role; it exists to call the gateway on
    behalf of a NAMED owner (X-Act-As-Owner) so the operation is authorized
    and data-scoped exactly as that owner. Never granted to a human; carried
    by the seeded service PAT (nhdw-service-token secret).
  combine_strategy: union
  capabilities:
    - act_as_owner
