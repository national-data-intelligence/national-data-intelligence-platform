---
# Seed the running cluster. Wraps the canonical seed scripts UNCHANGED, in bootstrap.sh's
# step-7 order — no seeding logic is reimplemented here. The ONE seeding principle holds: only
# the external source replicas are seeded; the REAL pipeline populates everything downstream;
# app/security state (never pipeline-derivable) is seeded from the seed-pack. The seed-pack
# compatibility gate (P1.7) fires inside seed-app-security.sh and aborts on a system/pack mismatch.
#
# KEEP IN LOCKSTEP with bundle/scripts/bootstrap.sh steps 6-7.x: if a seed step is added there,
# add it here too (a future refactor may extract a shared seed-all.sh both callers invoke).

# The in-cluster ingestors reach the host-published source ports via host.k3d.internal — an entry
# k3d injects into CoreDNS at cluster creation. Verify-only (orchestration must not mutate system
# config): if it is missing the cluster is malformed and the boot must stop.
- name: Verify host.k3d.internal RESOLVES from inside the cluster (ingestors need it)
  # k3d injects this alias into CoreDNS NodeHosts; on k3s the provision role
  # supplies it via a coredns-custom server block instead. The first version of
  # this check grepped NodeHosts — the k3d mechanism — and therefore failed on
  # every k3s host whose DNS was working perfectly. Test the OUTCOME, not one
  # implementation: resolve the name from a pod, whatever put it there.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl -n {{ nhdw_namespace }} run dns-probe-$$ --rm -i --restart=Never \
        --image=python:3.12-alpine --timeout=90s -- \
        python3 -c "import socket; print(socket.gethostbyname('host.k3d.internal'))" \
        | grep -E '^[0-9]+\.'
    executable: /bin/bash
  changed_when: false

# The COUNTRY threads through here or nowhere: sources-up.sh consults the
# profile to decide whether packed dumps may be trusted, and the synthesizers
# stamp it into their markers. Without this environment block the remote seed
# always behaved as the default country regardless of what the host's ACTIVE
# pointer said — the k3d bootstrap gained profile awareness and the ansible
# path silently did not.
- name: Bring up the external source replicas (dhis2/openmrs/hcmis/mbrana/mfr/fayda)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/sources-up.sh up"
  args: { chdir: "{{ nhdw_repo_root }}" }
  environment:
    NHDW_PROFILE: "{{ nhdw_profile | default('et-v3') }}"
    NHDW_PROFILE_DIR: "{{ nhdw_profile_dir | default('/opt/nhdw-profiles') }}"
  changed_when: true

- name: DATA seed — source replicas + the real pipeline (sources -> lake -> CH -> vault -> marts)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/seed-realistic.sh"
  args: { chdir: "{{ nhdw_repo_root }}" }
  environment:
    NHDW_PROFILE: "{{ nhdw_profile | default('et-v3') }}"
    NHDW_PROFILE_DIR: "{{ nhdw_profile_dir | default('/opt/nhdw-profiles') }}"
  changed_when: true

- name: APP/SECURITY seed — ops DB, Keycloak, roles, OPA, program-demo (seed-pack, compat-gated)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/seed-app-security.sh"
  args: { chdir: "{{ nhdw_repo_root }}" }
  environment:
    NHDW_PROFILE: "{{ nhdw_profile | default('et-v3') }}"
    NHDW_PROFILE_DIR: "{{ nhdw_profile_dir | default('/opt/nhdw-profiles') }}"
  changed_when: true

# The host half of the demo console's Switch-profile button: the gateway drops
# a request into /opt/nhdw-state/swap-requests and this service runs the SAME
# canonical scripts the tasks above run, reporting stages back. Installed here
# so a provisioned host can switch countries from the console without anyone
# shelling in.
- name: Install the profile-swap worker unit
  ansible.builtin.copy:
    src: "{{ nhdw_repo_root }}/bundle/systemd/nhdw-profile-swap.service"
    dest: /etc/systemd/system/nhdw-profile-swap.service
    remote_src: true
    mode: "0644"
  become: true

- name: Enable + start the profile-swap worker
  ansible.builtin.systemd:
    name: nhdw-profile-swap
    enabled: true
    state: restarted
    daemon_reload: true
  become: true

- name: Regenerate + load the OPA policy from the permission store (opa test gated, fail-closed)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/regen-opa-policy.sh"
  args: { chdir: "{{ nhdw_repo_root }}" }
  changed_when: true

# The gateway is deployed with an OPA self-test that needs the catalog the APP seed just wrote;
# restart it and gate the gateway-driven seeds below on it being Ready (else they race it).
- name: Restart the gateway so its OPA self-test picks up the seeded catalog
  ansible.builtin.command: "kubectl -n {{ nhdw_namespace }} rollout restart deploy/nhdw-gateway"
  changed_when: true

- name: Wait for the gateway to be Ready after the restart
  ansible.builtin.command: "kubectl -n {{ nhdw_namespace }} rollout status deploy/nhdw-gateway --timeout=180s"
  changed_when: false

- name: Docs seed (docs/*.md -> object store nhdw-docs, served via /gw/docs)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/seed-docs.sh"
  args: { chdir: "{{ nhdw_repo_root }}" }
  changed_when: true

- name: ML seed (seed-pack/app/ml -> MLflow registry -> ops_ml.ml_predictions)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/seed-ml.sh"
  args: { chdir: "{{ nhdw_repo_root }}" }
  changed_when: true

- name: Projects + datasets seed (real /api/projects + /api/datasets)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/seed-projects.sh"
  args: { chdir: "{{ nhdw_repo_root }}" }
  changed_when: true

- name: Resource-request seed (real /api/workspace/resource-request + decide)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/seed-resource-requests.sh"
  args: { chdir: "{{ nhdw_repo_root }}" }
  changed_when: true

- name: Model-projects seed (platform models -> real adopt-model API)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/seed-model-projects.sh"
  args: { chdir: "{{ nhdw_repo_root }}" }
  changed_when: true

- name: Graduation seed (seed-pack/app/project-review -> real submit/approve/reject API)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/seed-graduation.sh"
  args: { chdir: "{{ nhdw_repo_root }}" }
  changed_when: true
