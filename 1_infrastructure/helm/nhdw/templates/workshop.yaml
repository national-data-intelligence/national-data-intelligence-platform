{{- $c := index .Values.components "workshop" -}}
apiVersion: apps/v1
kind: Deployment
metadata: { name: workshop, namespace: {{ .Values.namespace }}, labels: { app: workshop, tier: dashboard } }
spec:
  replicas: {{ $c.replicas }}
  selector: { matchLabels: { app: workshop } }
  template:
    metadata: { labels: { app: workshop, tier: dashboard } }
    spec:
      containers:
        - name: dashboard
          image: {{ include "nhdw.image" (dict "name" "workshop" "ctx" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [ { containerPort: 80, name: http } ]
          # env order matches the kustomize strategic-merge result (overlay prepends the
          # nip.io OIDC vars ahead of the base env) so helm/kustomize stay byte-identical.
          env:
            - { name: KEYCLOAK_PUBLIC_BASE, value: {{ include "nhdw.kcPublicBase" . | quote }} }
            - { name: OIDC_REDIRECT_URI,    value: "https://workshop.{{ .Values.hostBase }}/" }
            - { name: APP_BASE,             value: "https://workshop.{{ .Values.hostBase }}" }
            - { name: DEV_AUTH,             value: "false" }
            - { name: KEYCLOAK_BASE,        value: {{ .Values.keycloak.internalBase | quote }} }
            - { name: OIDC_REALM,           value: "moh-staff" }
            - { name: OIDC_CLIENT_ID,       value: "workshop" }
            - { name: GATEWAY_URL,          value: "http://nhdw-gateway.{{ .Values.namespace }}.svc.cluster.local:8000" }
          {{- with $c.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 3, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: workshop, namespace: {{ .Values.namespace }}, labels: { app: workshop } }
spec:
  selector: { app: workshop }
  ports: [ { port: 80, targetPort: http, name: http } ]
