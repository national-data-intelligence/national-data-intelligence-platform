---
# Health gate — the boot is "done" only if the system is actually demoable (project goal).
# Wraps the canonical verify-system.sh (the same fast regression gate bootstrap.sh runs at 7.9)
# and adds a workloads-Ready wait + an HTTPS reachability probe of every ingress host + an
# OPA-enforcement assertion (the negative-path guard must be ON, not fail-open).

- name: Wait for every app-tier Deployment to become Available
  ansible.builtin.command: "kubectl -n {{ nhdw_namespace }} wait --for=condition=Available deploy --all --timeout=600s"
  changed_when: false

- name: Probe each dashboard / ingress host over HTTPS (expects a response, not a dead port)
  ansible.builtin.uri:
    url: "https://{{ item }}.{{ nhdw_host_base }}/"
    validate_certs: false
    status_code: [200, 301, 302, 303, 401, 403]
  loop: [internal-bi, admin, workshop, public, gateway, keycloak]
  register: verify_probe
  retries: 10
  delay: 15
  until: verify_probe is succeeded

- name: Assert the gateway ENFORCES OPA (fail-closed, not fail-open)
  ansible.builtin.command: >-
    kubectl -n {{ nhdw_namespace }} get deploy nhdw-gateway
    -o jsonpath={.spec.template.spec.containers[0].env[?(@.name=="OPA_ENFORCE")].value}
  register: verify_opa
  changed_when: false
  failed_when: verify_opa.stdout != "true"

- name: Run the canonical regression gate (verify-system.sh — same as bootstrap step 7.9)
  ansible.builtin.command: "bash {{ nhdw_scripts_dir }}/verify-system.sh"
  args: { chdir: "{{ nhdw_repo_root }}" }
  changed_when: false
